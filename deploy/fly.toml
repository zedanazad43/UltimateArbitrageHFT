# fly.toml app configuration file generated for ultimatearbitragehft on 2026-06-29T19:49:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ultimatearbitragehft'
primary_region = 'iad'

[build]
  dockerfile = 'hft/Dockerfile'

[env]
  API_ADDR = ':8080'
  METRICS_ADDR = ':9090'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[metrics]]
  port = 9090
  path = '/metrics'
