name: UltimateArbitrageHFT CI/CD

on:
  push:
    branches: [main, refactor/bots-unified-setup]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run audit and try to fix
        run: |
          npm audit || true
          npm audit fix || true

      - name: Run tests
        run: npm test

      - name: Build and Deploy (Cloudflare Workers)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/bots-unified-setup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run build

      - name: Upload workflow artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./dist # عدّل للإنسب حسب نتيجة build الخاص بك

      - name: Report status
        run: echo "✅ Build, test, audit & deploy completed!"
