version: '3.9'

services:
  # Node.js Worker + Dashboard (Cloudflare integration layer)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dhi
      args:
        NODE_ENV: production
    container_name: ultimatearbitragehft-worker
    ports:
      - "8787:8787"  # Dashboard / API port
    environment:
      NODE_ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      KUCOIN_SECRET_KEY: ${KUCOIN_SECRET_KEY:-}
      KUCOIN_PASSPHRASE: ${KUCOIN_PASSPHRASE:-}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_SECRET_KEY: ${BITGET_SECRET_KEY:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
      BITMART_API_KEY: ${BITMART_API_KEY:-}
      BITMART_SECRET_KEY: ${BITMART_SECRET_KEY:-}
      BITMART_MEMO: ${BITMART_MEMO:-}
      HFT_ENGINE_URL: http://hft-engine:8080
      HFT_ENGINE_SECRET: ${HFT_ENGINE_SECRET:-dev-hft-secret}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_WORKER_URL: http://worker:8787
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ALCHEMY_ETHEREUM_ENDPOINT: ${ALCHEMY_ETHEREUM_ENDPOINT:-}
      VSCODE_API_TOKEN: ${VSCODE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      hft-engine:
        condition: service_healthy
    networks:
      - arbitrage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.cache

  # Go HFT Engine (sub-millisecond arbitrage logic)
  hft-engine:
    build:
      context: ./hft
      dockerfile: Dockerfile.dhi
      args:
        GOOS: linux
        GOARCH: amd64
    container_name: ultimatearbitragehft-engine
    ports:
      - "9090:9090"  # Prometheus metrics port
    environment:
      PAPER_TRADING: ${PAPER_TRADING:-true}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-500}
      METRICS_ADDR: :9090
      MIN_NET_PROFIT_PCT: ${MIN_NET_PROFIT_PCT:-0.05}
      MAX_SPREAD_PCT: ${MAX_SPREAD_PCT:-5.0}
      INITIAL_CAPITAL_USD: ${INITIAL_CAPITAL_USD:-1000}
      MAX_DAILY_LOSS_USD: ${MAX_DAILY_LOSS_USD:-25}
      MIN_SECONDS_BETWEEN_TX: ${MIN_SECONDS_BETWEEN_TX:-30}
      WIN_RATE: ${WIN_RATE:-0.55}
      RISK_REWARD_RATIO: ${RISK_REWARD_RATIO:-2.0}
      MAX_GAS_COST_PCT: ${MAX_GAS_COST_PCT:-0.30}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://rpc.flashbots.net}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks:
      - arbitrage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # PostgreSQL for trade logging and state persistence
  postgres:
    image: postgres:16-alpine
    container_name: ultimatearbitragehft-postgres
    environment:
      POSTGRES_USER: arbitrage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbitrage-dev-pass}
      POSTGRES_DB: ultimatearbitrage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - arbitrage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitrage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  arbitrage:
    driver: bridge

