version: '3.9'

services:
  # Node.js API service (hardened)
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dhi
      args:
        NODE_ENV: production
    container_name: api-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.cache
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O-", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Apache httpd web server (hardened)
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dhi
    container_name: web-service
    volumes:
      # Bind mount static content (read-only from container perspective)
      - ./packages/web:/usr/local/apache2/htdocs:ro
    ports:
      - "8080:80"
    environment:
      APACHE_LOG_DIR: /var/log/apache2
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/apache2
      - /var/run
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "--fail", "-o", "/dev/null", "-s", "-w", "%{http_code}", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
