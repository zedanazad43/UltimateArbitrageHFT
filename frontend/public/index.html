<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Control</title>
  <style>
    :root {
      --bg: #0b0e14; --card: #151a23; --border: #2a2f3a; --gold: #f0b90b;
      --green: #2ecc71; --red: #ff6b6b; --text: #eee; --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
    
    /* Login Screen */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--card); padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .login-box h1 { color: var(--gold); margin-bottom: 8px; }
    .login-box p { color: var(--muted); margin-bottom: 20px; font-size: 0.9em; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 16px; font-size: 1em; }
    button { width: 100%; padding: 12px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: var(--red); margin-top: 12px; font-size: 0.9em; }
    
    /* Dashboard */
    #dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 2px solid var(--gold); margin-bottom: 24px; }
    .header h1 { color: var(--gold); font-size: 1.4em; }
    .header-actions { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    .btn:hover { opacity: 0.85; }
    .btn-gold { background: var(--gold); color: #000; border: none; }
    
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--card); padding: 16px; border-radius: 10px; border-left: 4px solid var(--gold); }
    .stat-label { color: var(--muted); font-size: 0.8em; margin-bottom: 6px; }
    .stat-value { font-size: 1.5em; font-weight: bold; }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    
    .section { margin-bottom: 24px; }
    .section h2 { color: var(--gold); font-size: 1.1em; margin-bottom: 12px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: right; color: var(--muted); font-size: 0.8em; padding: 8px; border-bottom: 1px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); }
    .table-wrap { background: var(--card); padding: 16px; border-radius: 10px; overflow-x: auto; }
    
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }
    .status-dot.warn { background: var(--gold); }
    
    #loading { text-align: center; padding: 60px; color: var(--muted); font-size: 1.2em; }
    .refresh-btn { margin-bottom: 16px; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>🔷 Nexus Control</h1>
    <p>UltimateArbitrageHFT • لوحة التحكم</p>
    <input id="token-input" type="password" placeholder="ADMIN_TOKEN" />
    <button id="login-btn" onclick="doLogin()">تسجيل الدخول</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <h1>🔷 UltimateArbitrageHFT</h1>
    <div class="header-actions">
      <button class="btn" id="btn-mode" onclick="toggleMode()">تبديل الوضع</button>
      <button class="btn" id="btn-engine" onclick="toggleEngine()">تشغيل/إيقاف</button>
      <button class="btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
  
  <div id="loading">⏳ جاري التحميل...</div>
  
  <div id="main-content" style="display:none;">
    <div class="stats" id="stats"></div>
    
    <button class="btn btn-gold refresh-btn" onclick="loadData()">↻ تحديث البيانات</button>
    
    <div class="section">
      <h2>💰 أرصدة المنصات</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>المنصة</th><th>الحالة</th><th>USDT</th><th>USDC</th><th>ETH</th><th>BTC</th></tr>
          </thead>
          <tbody id="balances"></tbody>
        </table>
      </div>
    </div>
    
    <div class="section">
      <h2>📊 الأرباح</h2>
      <div class="table-wrap">
        <div id="pnl" style="padding:12px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://api.ecostamp.net';
let TOKEN = localStorage.getItem('nexus_token') || '';
let state = {};

if (TOKEN) showDashboard();

async function doLogin() {
  const input = document.getElementById('token-input');
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  TOKEN = input.value.trim();
  if (!TOKEN) { err.textContent = 'أدخل الـ TOKEN'; return; }
  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  err.textContent = '';
  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN }),
      credentials: 'include'
    });
    if (r.ok) {
      localStorage.setItem('nexus_token', TOKEN);
      showDashboard();
    } else {
      err.textContent = 'Token غير صالح';
    }
  } catch (e) {
    err.textContent = 'خطأ في الاتصال';
  }
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
}

function doLogout() {
  localStorage.removeItem('nexus_token');
  TOKEN = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, {
    headers: { 'x-admin-token': TOKEN }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function loadData() {
  const loading = document.getElementById('loading');
  const main = document.getElementById('main-content');
  loading.style.display = 'block';
  main.style.display = 'none';
  try {
    const results = await Promise.allSettled([
      api('/api/status'),
      api('/api/balances'),
      api('/api/pnl'),
      api('/api/execution-health')
    ]);
    state = {
      status: results[0].value?.value,
      balances: results[1].value?.value,
      pnl: results[2].value?.value,
      exec: results[3].value?.value
    };
    renderStats();
    renderBalances();
    renderPnl();
    loading.style.display = 'none';
    main.style.display = 'block';
  } catch (e) {
    loading.textContent = 'خطأ: ' + e.message;
  }
}

function renderStats() {
  const s = state.status;
  if (!s) return;
  const live = !s.paper_trading;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">الوضع</div><div class="stat-value ${live ? 'red' : 'green'}">${live ? 'LIVE' : 'PAPER'}</div></div>
    <div class="stat-card"><div class="stat-label">التداول</div><div class="stat-value ${s.trading_enabled ? 'green' : 'red'}">${s.trading_enabled ? 'ON' : 'OFF'}</div></div>
    <div class="stat-card"><div class="stat-label">Spot Lock</div><div class="stat-value">${s.spot_only_lock ? 'ON' : 'OFF'}</div></div>
  `;
  document.getElementById('btn-mode').textContent = live ? '← PAPER' : '← LIVE';
  document.getElementById('btn-engine').textContent = s.trading_enabled ? '⏹ إيقاف' : '▶ تشغيل';
}

function renderBalances() {
  const data = state.balances?.value?.data || [];
  document.getElementById('balances').innerHTML = data.map(b => `
    <tr>
      <td>${b.exchange}</td>
      <td><span class="status-dot ${b.configured ? 'ok' : 'warn'}"></span>${b.configured ? 'منظمة' : 'غير منظمة'}</td>
      <td>${(+b.balances?.USDT || 0).toFixed(2)}</td>
      <td>${(+b.balances?.USDC || 0).toFixed(2)}</td>
      <td>${(+b.balances?.ETH || 0).toFixed(4)}</td>
      <td>${(+b.balances?.BTC || 0).toFixed(6)}</td>
    </tr>
  `).join('');
}

function renderPnl() {
  const d = state.pnl?.value?.data || {};
  const items = [
    ['CEL (7 trades)', d.cex?.pnl || 0],
    ['DEX (672 trades)', d.dex?.pnl || 0],
    ['Perps (20 trades)', d.perps?.pnl || 0]
  ];
  document.getElementById('pnl').innerHTML = items.map(([label, pnl]) => {
    const v = parseFloat(pnl || 0);
    const cls = v >= 0 ? 'green' : 'red';
    return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <span>${label}</span>
      <span class="stat-value ${cls}">${v.toFixed(4)}</span>
    </div>`;
  }).join('');
}

async function toggleMode() {
  const mode = state.status?.paper_trading ? 'live' : 'paper';
  await api('/mode/' + mode);
  loadData();
}

async function toggleEngine() {
  const enabled = state.status?.trading_enabled;
  await api(enabled ? '/stop' : '/start');
  loadData();
}

// Auto-refresh every 30s
setInterval(loadData, 30000);
</script>
</body>
</html>
