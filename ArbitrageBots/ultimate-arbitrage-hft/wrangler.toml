name = "ultimate-arbitrage-hft"
main = "index.js"
compatibility_date = "2025-04-18"
nodejs_compat = true

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

# Secrets required by this worker (set via `wrangler secret put <NAME>`
# or with the npm helper scripts in UltimateArbitrageBot/):
#
# Required for live trading:
#   MEXC_API_KEY      — MEXC spot trading API key
#   MEXC_API_SECRET   — MEXC spot trading API secret
#
# Required to protect admin endpoints (/start /stop /scan /mode/* /config):
#   ADMIN_TOKEN       — generated by `npm run cf:set-admin-token`
#
# Optional (Telegram trade alerts):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#
# Optional (0x DEX price feeds):
#   ZEROX_API_KEY
#
# Optional (Alchemy cross-chain price feeds):
#   ALCHEMY_API_KEY
