name = "ultimate-arbitrage-hft"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[triggers]
crons = ["*/1 * * * *"]
