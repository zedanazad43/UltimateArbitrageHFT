app = "ultimatearbitragehft"

[build]
  dockerfile = "hft/Dockerfile"

[env]
  API_ADDR = ":8080"
  METRICS_ADDR = ":9090"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[metrics]
  port = 9090
  path = "/metrics"
