name = "ultimate-arbitrage-hft"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# --- Routes ---
[[routes]]
pattern = "api.ecostamp.net/*"
zone_name = "ecostamp.net"

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[durable_objects.bindings]]
name = "HFT_BACKUP"
class_name = "HFTBackup"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]
new_sqlite_classes = ["MarketStreamer"]

# --- KV ---
[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

# --- D1 ---
[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

# --- AI ---
[ai]
binding = "AI"

# --- Queues ---
[[queues.consumers]]
queue = "ultimate-arbitrage-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.producers]]
binding = "ULTIMATEARBITRAGEQUEUE"
queue = "ultimate-arbitrage-queue"

# --- R2 ---
[[r2_buckets]]
binding = "R2"
bucket_name = "ultimate-arbitrage-logs"

# --- Service Bindings ---
[[services]]
binding = "hero-super-agent"
service = "hero-super-agent"
environment = "production"

[[services]]
binding = "nexus-arbitrage"
service = "nexus-arbitrage"
environment = "production"
entrypoint = "default"

# --- Rate Limits ---
[[unsafe.bindings]]
type = "ratelimit"
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# --- Observability ---
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

# --- Tail Consumer ---
[[tail_consumers]]
service = "ultimate-arbitrage-tail"

# --- Cron Triggers ---
[triggers]
crons = ["*/1 * * * *"]

# --- Environment Variables ---
[vars]
STRATEGY_MODE                           = "multi_exchange"
EXECUTION_EXCHANGES_ALLOWLIST           = "mexc,bitget,binance,kucoin,bybit,gateio,htx"
DIRECT_EXCHANGES                        = "kucoin"
