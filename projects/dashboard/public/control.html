<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UltimateArbitrageHFT — Control</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #7c5cff;
      --accent2: #00e5ff;
      --danger: #ff4d6d;
      --ok: #00e676;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 800px at 10% -10%, rgba(124,92,255,.35), transparent),
                  radial-gradient(900px 600px at 110% 10%, rgba(0,229,255,.25), transparent),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 40px; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px 22px; border: 1px solid var(--border); border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .title { display: grid; gap: 4px; }
    .title h1 { margin: 0; font-size: 22px; letter-spacing: .4px; }
    .title span { color: var(--muted); font-size: 12px; }
    .badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge {
      padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); color: var(--text);
      background: rgba(255,255,255,.05); backdrop-filter: blur(10px);
    }
    .badge.ok { color: var(--ok); border-color: rgba(0,230,118,.35); background: rgba(0,230,118,.08); }
    .badge.warn { color: #ffd740; border-color: rgba(255,215,64,.35); background: rgba(255,215,64,.08); }
    .badge.danger { color: var(--danger); border-color: rgba(255,77,109,.35); background: rgba(255,77,109,.08); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; margin-top: 18px; }
    .card {
      grid-column: span 4;
      padding: 16px 18px; border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: grid; gap: 10px;
    }
    .card h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .value { font-size: 28px; font-weight: 700; letter-spacing: .3px; }
    .sub { color: var(--muted); font-size: 12px; }
    .card.wide { grid-column: span 8; }

    table { width: 100%; border-collapse: collapse; color: var(--text); font-size: 13px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    tr:hover td { background: rgba(255,255,255,.03); }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      appearance: none; border: 1px solid var(--border); color: var(--text); padding: 10px 14px;
      border-radius: 12px; background: rgba(255,255,255,.06); cursor: pointer; font-weight: 600;
      backdrop-filter: blur(10px);
    }
    button.primary { background: linear-gradient(180deg, rgba(124,92,255,.35), rgba(124,92,255,.15)); border-color: rgba(124,92,255,.5); }
    button.danger { background: linear-gradient(180deg, rgba(255,77,109,.25), rgba(255,77,109,.1)); border-color: rgba(255,77,109,.45); color: #ffe2e7; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .toast {
      position: fixed; right: 16px; bottom: 16px; padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(20,24,35,.9); color: var(--text);
      backdrop-filter: blur(14px); box-shadow: 0 18px 50px rgba(0,0,0,.5);
    }
    @media (max-width: 980px) {
      .card { grid-column: span 12; }
      .card.wide { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>UltimateArbitrageHFT Control</h1>
        <span>Worker: https://ultimatearbitragehft.zedanazad43.workers.dev</span>
      </div>
      <div class="badges" id="modeBadges">
        <div class="badge warn" id="modeBadge">loading…</div>
        <div class="badge" id="tradeBadge">trading: checking</div>
        <div class="badge" id="lastScanBadge">lastScan: —</div>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Mode</h3>
        <div class="value" id="modeValue">—</div>
        <div class="sub">paper / live</div>
        <div class="actions">
          <button class="primary" id="btnPaper">Enable Paper</button>
          <button class="danger" id="btnLive">Enable Live</button>
        </div>
      </div>
      <div class="card">
        <h3>Trades</h3>
        <div class="value" id="tradesValue">—</div>
        <div class="sub">total trades</div>
        <div class="actions">
          <button id="btnScan">Run Scan</button>
          <button id="btnStatus">Refresh</button>
        </div>
      </div>
      <div class="card">
        <h3>PnL</h3>
        <div class="value" id="pnlValue">—</div>
        <div class="sub">totalProfit</div>
        <div class="actions">
          <button id="btnOpportunities">Opportunities</button>
        </div>
      </div>

      <div class="card wide">
        <h3>Recent opportunities</h3>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>Symbol</th><th>Strategy</th><th>Spread %</th><th>Buy</th><th>Sell</th><th>Direction</th><th>TS</th></tr></thead>
            <tbody id="oppsBody"><tr><td colspan="7" class="sub">loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
  <script>
    const API = 'https://ultimatearbitragehft.zedanazad43.workers.dev';
    const ADMIN = localStorage.getItem('nexus_admin_token') || (function () {
      // Match the worker's /control-panel localStorage key so tokens set there
      // work here and vice versa. Prompt once on first visit, store locally.
      const tok = window.prompt('Enter your admin token (stored only in this browser):');
      if (tok && tok.trim()) { localStorage.setItem('nexus_admin_token', tok.trim()); return tok.trim(); }
      return '';
    })();
    const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };

    async function req(path, opts = {}) {
      const headers = { 'x-admin-token': ADMIN, ...(opts.headers || {}) };
      const res = await fetch(API + path, { ...opts, headers });
      if (res.status === 401) { toast('Unauthorized'); throw new Error('unauthorized'); }
      if (res.status === 404) { toast('Not found'); throw new Error('not found'); }
      return res;
    }
    async function loadStatus() {
      const res = await req('/api/status');
      const d = await res.json();
      const paper = d.paper_trading !== false;
      const modeEl = document.getElementById('modeValue');
      const modeBadge = document.getElementById('modeBadge');
      modeEl.textContent = paper ? 'Paper' : 'Live';
      modeBadge.textContent = paper ? 'mode: paper' : 'mode: live';
      modeBadge.className = 'badge ' + (paper ? 'warn' : 'danger');
      document.getElementById('tradeBadge').textContent = 'trading: ' + (d.trading_enabled ? 'enabled' : 'disabled');
      const lastScanTs = Number(d?.lastScan?.timestamp || d?.lastScanTimestamp || 0);
      document.getElementById('lastScanBadge').textContent = 'lastScan: ' + (lastScanTs ? new Date(lastScanTs).toLocaleTimeString() : '—');
      document.getElementById('tradesValue').textContent = Number(d.totalTrades ?? 0).toLocaleString();
      document.getElementById('pnlValue').textContent = '$' + Number(d.totalProfit ?? 0).toFixed(2);
      return d;
    }
    async function loadOpportunities() {
      const res = await req('/opportunities');
      const rows = await res.json();
      const tbody = document.getElementById('oppsBody');
      if (!rows?.length) { tbody.innerHTML = '<tr><td colspan="7" class="sub">none</td></tr>'; return; }
      tbody.innerHTML = rows.slice(0, 20).map(r => `<tr>
        <td>${r.symbol}</td><td>${r.strategy}</td>
        <td>${Number(r.spread_pct || 0).toFixed(3)}%</td>
        <td>${r.buy_exchange}</td><td>${r.sell_exchange}</td>
        <td>${r.direction}</td>
        <td>${new Date(r.timestamp).toLocaleTimeString()}</td>
      </tr>`).join('');
    }
    document.getElementById('btnStatus').onclick = async () => { await loadStatus(); await loadOpportunities(); toast('refreshed'); };
    document.getElementById('btnScan').onclick = async () => {
      const ts = Date.now();
      await req('/scan', { headers: { 'x-request-ts': String(ts) } });
      toast('scan started');
    };
    document.getElementById('btnOpportunities').onclick = async () => { await loadOpportunities(); toast('opportunities loaded'); };
    document.getElementById('btnPaper').onclick = async () => {
      const ts = Date.now();
      const res = await req('/mode/paper', { method: 'POST', headers: { 'x-request-ts': String(ts), 'content-type': 'application/json' }, body: '{}' });
      toast(await res.text());
    };
    document.getElementById('btnLive').onclick = async () => {
      const res = await req('/mode/live', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
      toast(await res.text());
    };
    (async () => { await loadStatus(); await loadOpportunities(); })();
  </script>
</body>
</html>
