name = "ultimatearbitragehft"
main = "index.js"
compatibility_date = "2025-04-18"
compatibility_flags = ["nodejs_compat"]
account_id = "652e53f35781522e2745784cc4425d9d"

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[kv_namespaces]]
binding = "KV_STORAGE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[d1_databases]]
binding = "MY_D1"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[durable_objects.bindings]]
name = "HFT_BACKUP"
class_name = "HFTBackup"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[migrations]]
tag = "v2"
new_classes = ["HFTBackup"]

[[migrations]]
tag = "v3"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "arbitrage_events"

[[r2_buckets]]
binding = "TRADE_LOGS"
bucket_name = "ultimate-arbitrage-logs"

[[r2_buckets]]
binding = "R2"
bucket_name = "ultimate-arbitrage-logs"

[ai]
binding = "AIWORKER"

[[queues.producers]]
binding = "TRADE_QUEUE"
queue = "ultimate-arbitrage-queue"

[[queues.producers]]
binding = "ULTIMATEARBITRAGEQUEUE"
queue = "ultimate-arbitrage-queue"

[[queues.consumers]]
queue = "ultimate-arbitrage-queue"
max_batch_size = 10
max_batch_timeout = 30

# NOTE: Do NOT declare PROXY_AUTH_HEADER or BITGET_API_KEY in [vars].
# These are uploaded as Worker secrets via `wrangler secret bulk` in CI; a
# [vars] binding with the same name makes that upload fail with Cloudflare
# error 10053 ("Binding name already in use").
[vars]
PROXY_MODE = "auto"
PROXY_URL_1 = "https://proxy-gateway.zedanazad43.workers.dev"
PROXY_URL_2 = "https://1d7373f11e5c96fb-104-28-162-48.serveousercontent.com"
# Go HFT engine (Cloudflare Container) — engine API server base URL.
# HFT_ENGINE_SECRET is uploaded as a Worker secret (never in [vars]).
HFT_ENGINE_URL = "https://hft-engine.zedanazad43.workers.dev"

# Cloudflare Workers AI
CF_AI_MODEL = "llama-3.1-8b-instruct"
CF_AI_ENDPOINT = "/ai/chat/completions"
AI = "true"

# Bitget credentials — set via Dashboard or `wrangler secret put`.
# Never put a real key in [vars]; a placeholder here also collides with the
# CI secret upload (error 10053).
