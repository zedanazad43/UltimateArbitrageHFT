name = "ultimate-arbitrage-hft"
main = "../ArbitrageBots/ultimate-arbitrage-hft/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[ai]
binding = "AI"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[triggers]
crons = ["*/1 * * * *"]

# Secrets required by this worker (set via `wrangler secret put <NAME>`):
# - ADMIN_TOKEN          : protects /start /stop /scan /mode/* /config
# - MEXC_API_KEY         : MEXC exchange API key (required for live trading)
# - MEXC_API_SECRET      : MEXC exchange API secret (required for live trading)
# - TELEGRAM_BOT_TOKEN   : Telegram bot token for alerts
# - TELEGRAM_CHAT_ID     : Telegram chat ID for alerts
# - ZEROX_API_KEY        : 0x Protocol API key (optional, for DEX price feeds)
# - DEX_WALLET_ADDRESS   : DEX/Metamask wallet address (optional)

