version: '3.9'

# ── UltimateArbitrageHFT — 3-Service Local Stack ──────────────────────────────
# Ports:
#   8787 — Ultimate Arbitrage HFT (main Worker / dashboard)
#   8788 — Hero Super Agent (AI orchestration API)
#   8789 — Stampbook / Web front-end (static site via nginx)
#
# Usage:
#   docker-compose up -d          # start all
#   docker-compose down           # stop all
#   docker-compose restart        # restart all
#   docker-compose logs -f        # follow logs
#   docker-compose ps             # check status
#
# Network: crypto-network (bridge) — matches fix-nat.bat

networks:
  crypto-network:
    driver: bridge
    name: crypto-network

services:

  # ── 1. Ultimate Arbitrage HFT ───────────────────────────────────────────────
  ultimate-arbitrage-hft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultimate-arbitrage-hft
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      KUCOIN_SECRET_KEY: ${KUCOIN_SECRET_KEY:-}
      KUCOIN_PASSPHRASE: ${KUCOIN_PASSPHRASE:-}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_SECRET_KEY: ${BITGET_SECRET_KEY:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
      BITMART_API_KEY: ${BITMART_API_KEY:-}
      BITMART_SECRET_KEY: ${BITMART_SECRET_KEY:-}
      BITMART_MEMO: ${BITMART_MEMO:-}
      HFT_ENGINE_SECRET: ${HFT_ENGINE_SECRET:-dev-hft-secret}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
    networks:
      - crypto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.cache
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 2. Hero Super Agent ──────────────────────────────────────────────────────
  hero-super-agent:
    build:
      context: ./hero-agent
    container_name: hero-super-agent
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      NODE_ENV: production
      PORT: "8788"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks:
      - crypto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O-", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 3. Stampbook / Web Front-end ─────────────────────────────────────────────
  stampbook:
    image: nginx:alpine
    container_name: stampbook
    ports:
      - "127.0.0.1:8789:80"
    volumes:
      - ./hero-super-agent/packages/web:/usr/share/nginx/html:ro
    networks:
      - crypto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
