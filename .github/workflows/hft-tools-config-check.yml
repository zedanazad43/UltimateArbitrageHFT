name: 'hft tools configuration check'

'on':
  pull_request:
    paths:
      - 'hft/**'
      - '.github/workflows/hft-tools-config-check.yml'
  push:
    branches:
      - main
    paths:
      - 'hft/**'
      - '.github/workflows/hft-tools-config-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tools-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hft/go.mod

      - name: Regenerate tools configuration
        working-directory: hft
        run: bash scripts/generate-tools-configuration.sh

      - name: Verify generated file is unchanged
        run: git diff --exit-code -- 'hft/# Tools Configuration.md'
