name: Deploy Worker (Manual)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:all

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            index.js
            src/
            migrations/
            wrangler.toml
            package.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: true
          include-hidden-files: false
    

      - name: Deploy Worker
        # Retry up to 3 times: Cloudflare's Workers API occasionally returns transient
        # 10500 errors. If the token correctly has "Account > Workers Scripts > Edit"
        # permission and retries still fail, check the token permissions/IP filtering
        # using the guidance printed by the "Verify Cloudflare credentials" step above.
        run: |
          for attempt in 1 2 3; do
            echo "--- Deploy attempt $attempt of 3 ---"
            if npx --yes wrangler@4 deploy; then
              echo "✅ Worker deployed successfully on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "⚠️ Deploy failed, waiting 15s before retry..."
              sleep 15
            fi
          done
          echo "::error::Worker deployment failed after 3 attempts."
          echo "::error::Verify the CLOUDFLARE_API_TOKEN has 'Account > Workers Scripts > Edit' permission"
          echo "::error::and no 'Client IP Address Filtering' restriction."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload secrets to Cloudflare Worker
        run: |
          python3 - <<'PYEOF'
          import json, os
          keys = [
            "MEXC_API_KEY", "MEXC_API_SECRET",
            "BINANCE_API_KEY", "BINANCE_API_SECRET",
            "OKX_API_KEY", "OKX_API_SECRET", "OKX_PASSPHRASE",
            "KUCOIN_API_KEY", "KUCOIN_SECRET_KEY", "KUCOIN_PASSPHRASE",
            "COINBASE_API_KEY", "COINBASE_SECRET_KEY",
            "BITGET_API_KEY", "BITGET_SECRET_KEY", "BITGET_API_PASSPHRASE",
            "BITMART_API_KEY", "BITMART_SECRET_KEY", "BITMART_MEMO",
            "BYBIT_API_KEY", "BYBIT_API_SECRET",
            "GATEIO_API_KEY", "GATEIO_API_SECRET",
            "HTX_API_KEY", "HTX_API_SECRET",
            "ZEROX_API_KEY", "ALCHEMY_API_KEY",
            "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
            "ADMIN_TOKEN",
            "GITHUB_TOKEN",
            "HFT_ENGINE_SECRET",
            "TEMPORAL_API_KEY",
          ]
          secrets = {k: os.environ[k] for k in keys if os.environ.get(k)}
          fd = os.open("/tmp/cf_secrets.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
            json.dump(secrets, f)
          PYEOF
          npx --yes wrangler@4 secret bulk /tmp/cf_secrets.json
          rm /tmp/cf_secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          BITMART_MEMO: ${{ secrets.BITMART_MEMO }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          GATEIO_API_KEY: ${{ secrets.GATEIO_API_KEY }}
          GATEIO_API_SECRET: ${{ secrets.GATEIO_API_SECRET }}
          HTX_API_KEY: ${{ secrets.HTX_API_KEY }}
          HTX_API_SECRET: ${{ secrets.HTX_API_SECRET }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HFT_ENGINE_SECRET: ${{ secrets.HFT_ENGINE_SECRET }}
          TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete"
          echo "   Worker  : ultimatearbitragehft"
          echo "   Mode    : unchanged (manual switch required)"
          echo "   Cron    : every minute"
          echo "   Monitor : Telegram bot or Worker dashboard"
