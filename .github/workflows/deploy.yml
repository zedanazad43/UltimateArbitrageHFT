name: Deploy Nexus Hub to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply ultimate-arbitrage-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload API Secrets
        run: |
          set_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            fi
          }
          set_secret MEXC_API_KEY        "$MEXC_API_KEY"
          set_secret MEXC_API_SECRET     "$MEXC_API_SECRET"
          set_secret BINANCE_API_KEY     "$BINANCE_API_KEY"
          set_secret BINANCE_API_SECRET  "$BINANCE_API_SECRET"
          set_secret OKX_API_KEY         "$OKX_API_KEY"
          set_secret OKX_API_SECRET      "$OKX_API_SECRET"
          set_secret KUCOIN_API_KEY      "$KUCOIN_API_KEY"
          set_secret KUCOIN_SECRET_KEY   "$KUCOIN_SECRET_KEY"
          set_secret COINBASE_API_KEY    "$COINBASE_API_KEY"
          set_secret COINBASE_SECRET_KEY "$COINBASE_SECRET_KEY"
          set_secret BITGET_API_KEY      "$BITGET_API_KEY"
          set_secret BITGET_SECRET_KEY   "$BITGET_SECRET_KEY"
          set_secret BITMART_API_KEY     "$BITMART_API_KEY"
          set_secret BITMART_SECRET_KEY  "$BITMART_SECRET_KEY"
          set_secret TELEGRAM_BOT_TOKEN  "$TELEGRAM_BOT_TOKEN"
          set_secret ALCHEMY_API_KEY     "$ALCHEMY_API_KEY"
          set_secret METAMASK_PRIVATE_KEY "$METAMASK_PRIVATE_KEY"
          set_secret ADMIN_TOKEN         "$ADMIN_TOKEN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          METAMASK_PRIVATE_KEY: ${{ secrets.METAMASK_PRIVATE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
