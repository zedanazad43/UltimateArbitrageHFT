name: Deploy to Cloudflare Workers
# CLOUDFLARE_API_TOKEN must be set as a repository secret.
# The token needs: Workers Scripts:Edit + D1:Edit permissions.
# IMPORTANT: The token must NOT have IP address restrictions, because
# GitHub Actions runners use dynamic IPs that change with every run.
# To fix "Cannot use the access token from location" (error 9109):
#   Cloudflare dashboard → My Profile → API Tokens → Edit token → remove IP Filter.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migration
        run: npx --yes wrangler@4 d1 execute ultimate-arbitrage-db --file=./migrations/schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
