name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          corepack enable || true
          corepack prepare pnpm@latest --activate || true
          pnpm install --frozen-lockfile=false
      
      - name: Run tests
        continue-on-error: true
        run: npm run test:all --if-present
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          environment: "production"

      - name: Upload secrets to Cloudflare Worker
        timeout-minutes: 5
        # NOTE: Secrets below marked as optional (GATEIO_*, ZEROX_*, ALCHEMY_*, HFT_ENGINE_*, TEMPORAL_*, EXTERNAL_PROXY_*)
        # will be gracefully skipped if not configured in GitHub repository settings.
        # The Python filter `if os.environ.get(k)` ensures missing secrets are not uploaded.
        run: |
          python3 - <<'PYEOF'
          import json, os
          keys = [
            "MEXC_API_KEY", "MEXC_API_SECRET",
            "BINANCE_API_KEY", "BINANCE_API_SECRET",
            "KUCOIN_API_KEY", "KUCOIN_SECRET_KEY", "KUCOIN_PASSPHRASE",
            "COINBASE_API_KEY", "COINBASE_SECRET_KEY",
            "BITGET_API_KEY", "BITGET_SECRET_KEY", "BITGET_API_PASSPHRASE",
            "BITMART_API_KEY", "BITMART_SECRET_KEY", "BITMART_MEMO",
            "BYBIT_API_KEY", "BYBIT_API_SECRET",
            "GATEIO_API_KEY", "GATEIO_API_SECRET",
            "HTX_API_KEY", "HTX_API_SECRET",
            "ZEROX_API_KEY", "ALCHEMY_API_KEY",
            "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
            "ADMIN_TOKEN", "WORKFLOW_ADMIN_TOKEN",
            "GITHUB_TOKEN",
            "HFT_ENGINE_SECRET",
            "TEMPORAL_API_KEY",
            "PROXY_URL",
            "PROXY_URL_1",
            "PROXY_LIST",
            "PROXY_AUTH_HEADER",
            "EXTERNAL_PROXY_URL",
            "EXTERNAL_PROXY_GATEWAY_URL",
            "EXTERNAL_PROXY_PROVIDER",
            "EXTERNAL_PROXY_USERNAME",
            "EXTERNAL_PROXY_PASSWORD",
            "EXTERNAL_PROXY_AUTH_HEADER",
          ]
          secrets = {k: os.environ[k] for k in keys if os.environ.get(k)}
          fd = os.open("/tmp/cf_secrets.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
            json.dump(secrets, f)
          PYEOF
          npx --yes wrangler@4 secret bulk /tmp/cf_secrets.json
          rm /tmp/cf_secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          BITMART_MEMO: ${{ secrets.BITMART_MEMO }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          HTX_API_KEY: ${{ secrets.HTX_API_KEY }}
          HTX_API_SECRET: ${{ secrets.HTX_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_AUTH_HEADER: ${{ secrets.PROXY_AUTH_HEADER }}
          EXTERNAL_PROXY_URL: ${{ secrets.EXTERNAL_PROXY_URL }}
          EXTERNAL_PROXY_PROVIDER: ${{ secrets.EXTERNAL_PROXY_PROVIDER }}
          EXTERNAL_PROXY_USERNAME: ${{ secrets.EXTERNAL_PROXY_USERNAME }}
          EXTERNAL_PROXY_PASSWORD: ${{ secrets.EXTERNAL_PROXY_PASSWORD }}
          EXTERNAL_PROXY_AUTH_HEADER: ${{ secrets.EXTERNAL_PROXY_AUTH_HEADER }}

      - name: Post-deploy endpoint smoke test
        id: smoke_test
        timeout-minutes: 5
        run: |
          node ./scripts/verify-production-endpoints.js
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          EXPECTED_WORKER_NAME: ultimatearbitragehft
          REQUIRE_READY_FOR_LIVE: "false"
          SKIP_CUSTOM_DOMAIN_CHECK: "true"

      - name: Telegram alert on smoke test failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping alert."
            exit 0
          fi

          short_sha=$(echo "$SHA" | cut -c1-7)
          text=$(printf 'Smoke test failed after deploy%%0AWorkflow: Deploy Worker%%0ABranch: %s%%0ASHA: %s%%0ARun: %s' "$BRANCH" "$short_sha" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete"
          echo "   Worker  : ultimatearbitragehft"
          echo "   Mode    : unchanged (manual switch required)"
          echo "   Cron    : every minute"
          echo "   Monitor : Telegram bot or Worker dashboard"
