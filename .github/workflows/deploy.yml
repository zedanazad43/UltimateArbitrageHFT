name: Deploy & Real Trade

on:
  workflow_dispatch:   # تشغيل يدوي فقط من GitHub Actions لأمان التداول المباشر
  # ولو أردت التشغيل التلقائي عند push للفرع main احذف التعليق عن الأسطر التالية:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migration
        run: npx --yes wrangler@4 d1 execute ultimate-arbitrage-db --file=./migrations/schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload secrets to Cloudflare Worker
        run: |
          upload_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx --yes wrangler@4 secret put "$name"
            fi
          }
          upload_secret MEXC_API_KEY        "$MEXC_API_KEY"
          upload_secret MEXC_API_SECRET     "$MEXC_API_SECRET"
          upload_secret BINANCE_API_KEY     "$BINANCE_API_KEY"
          upload_secret BINANCE_API_SECRET  "$BINANCE_API_SECRET"
          upload_secret OKX_API_KEY         "$OKX_API_KEY"
          upload_secret OKX_API_SECRET      "$OKX_API_SECRET"
          upload_secret OKX_PASSPHRASE      "$OKX_PASSPHRASE"
          upload_secret KUCOIN_API_KEY      "$KUCOIN_API_KEY"
          upload_secret KUCOIN_SECRET_KEY   "$KUCOIN_SECRET_KEY"
          upload_secret KUCOIN_PASSPHRASE   "$KUCOIN_PASSPHRASE"
          upload_secret COINBASE_API_KEY    "$COINBASE_API_KEY"
          upload_secret COINBASE_SECRET_KEY "$COINBASE_SECRET_KEY"
          upload_secret BITGET_API_KEY      "$BITGET_API_KEY"
          upload_secret BITGET_SECRET_KEY   "$BITGET_SECRET_KEY"
          upload_secret BITGET_API_PASSPHRASE "$BITGET_API_PASSPHRASE"
          upload_secret BITMART_API_KEY     "$BITMART_API_KEY"
          upload_secret BITMART_SECRET_KEY  "$BITMART_SECRET_KEY"
          upload_secret BITMART_MEMO        "$BITMART_MEMO"
          upload_secret ZEROX_API_KEY       "$ZEROX_API_KEY"
          upload_secret ALCHEMY_API_KEY     "$ALCHEMY_API_KEY"
          upload_secret TELEGRAM_BOT_TOKEN  "$TELEGRAM_BOT_TOKEN"
          upload_secret TELEGRAM_CHAT_ID    "$TELEGRAM_CHAT_ID"
          upload_secret ADMIN_TOKEN         "$ADMIN_TOKEN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          BITMART_MEMO: ${{ secrets.BITMART_MEMO }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}