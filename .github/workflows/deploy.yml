name: Deploy & Real Trade

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-build
          path: |
            index.js
            src/
            migrations/
            wrangler.toml
            package.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: true
          include-hidden-files: false

      - name: Verify Cloudflare credentials
        run: |
          # 1. Verify the token itself is valid
          HTTP=$(curl -s -o /tmp/cf_verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          cat /tmp/cf_verify.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::Cloudflare token verification failed (HTTP $HTTP)."
            echo "::error::Fix: go to Cloudflare dashboard → My Profile → API Tokens"
            echo "::error::→ Edit your token → remove 'Client IP Address Filtering' restriction"
            echo "::error::→ Ensure the token has permissions: Workers Scripts:Edit, D1:Edit, KV Storage:Edit"
            exit 1
          fi
          echo "✅ Cloudflare token is valid"

          # 2. Verify the token has Workers Scripts permission (Account level).
          #    A 403 here is the most common cause of wrangler deploy error code 10500
          #    ("Internal authentication error") — the token is valid but lacks this scope.
          WS_HTTP=$(curl -s -o /tmp/cf_workers.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          if [ "$WS_HTTP" = "403" ] || [ "$WS_HTTP" = "401" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN does not have Workers Scripts permission (HTTP $WS_HTTP)."
            echo "::error::This causes wrangler deploy to fail with error code 10500."
            echo "::error::Fix: go to Cloudflare dashboard → My Profile → API Tokens"
            echo "::error::→ Edit token → add permission: Account > Workers Scripts > Edit"
            echo "::error::→ Also remove any 'Client IP Address Filtering' restriction"
            cat /tmp/cf_workers.json
            exit 1
          fi
          echo "✅ Cloudflare credentials verified (token has Workers Scripts access)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Add missing columns to existing tables before running the full schema.
      # We inspect PRAGMA table_info first so the ALTER TABLE is only issued when
      # the column is genuinely absent — avoiding the silent-failure footgun of
      # running ALTER TABLE with "|| true" that would hide unrelated errors.
      - name: Apply incremental D1 column migrations
        run: |
          PRAGMA_OUT=$(npx --yes wrangler@4 d1 execute ultimate-arbitrage-db \
            --command "PRAGMA table_info(trades);" --remote --json 2>&1)
          if echo "$PRAGMA_OUT" | grep -qE '"name"\s*:\s*"mode"'; then
            echo "'mode' column already exists. Skipping ALTER TABLE."
          else
            echo "Adding 'mode' column..."
            npx --yes wrangler@4 d1 execute ultimate-arbitrage-db \
              --command "ALTER TABLE trades ADD COLUMN mode TEXT NOT NULL DEFAULT 'paper'" \
              --remote
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 migration
        run: npx --yes wrangler@4 d1 execute ultimate-arbitrage-db --file=./migrations/schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        # Retry up to 3 times: Cloudflare's Workers API occasionally returns transient
        # 10500 errors. If the token correctly has "Account > Workers Scripts > Edit"
        # permission and retries still fail, check the token permissions/IP filtering
        # using the guidance printed by the "Verify Cloudflare credentials" step above.
        run: |
          for attempt in 1 2 3; do
            echo "--- Deploy attempt $attempt of 3 ---"
            if npx --yes wrangler@4 deploy; then
              echo "✅ Worker deployed successfully on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "⚠️ Deploy failed, waiting 15s before retry..."
              sleep 15
            fi
          done
          echo "::error::Worker deployment failed after 3 attempts."
          echo "::error::Verify the CLOUDFLARE_API_TOKEN has 'Account > Workers Scripts > Edit' permission"
          echo "::error::and no 'Client IP Address Filtering' restriction."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload secrets to Cloudflare Worker
        run: |
          python3 - <<'PYEOF'
          import json, os
          keys = [
            "MEXC_API_KEY", "MEXC_API_SECRET",
            "BINANCE_API_KEY", "BINANCE_API_SECRET",
            "OKX_API_KEY", "OKX_API_SECRET",
            "KUCOIN_API_KEY", "KUCOIN_SECRET_KEY", "KUCOIN_PASSPHRASE",
            "COINBASE_API_KEY", "COINBASE_SECRET_KEY",
            "BITGET_API_KEY", "BITGET_SECRET_KEY", "BITGET_API_PASSPHRASE",
            "BITMART_API_KEY", "BITMART_SECRET_KEY", "BITMART_MEMO",
            "BYBIT_API_KEY", "BYBIT_API_SECRET",
            "GATEIO_API_KEY", "GATEIO_API_SECRET",
            "ZEROX_API_KEY", "ALCHEMY_API_KEY",
            "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
            "ADMIN_TOKEN",
          ]
          secrets = {k: os.environ[k] for k in keys if os.environ.get(k)}
          fd = os.open("/tmp/cf_secrets.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
            json.dump(secrets, f)
          PYEOF
          npx --yes wrangler@4 secret bulk /tmp/cf_secrets.json
          rm /tmp/cf_secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          BITMART_MEMO: ${{ secrets.BITMART_MEMO }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          GATEIO_API_KEY: ${{ secrets.GATEIO_API_KEY }}
          GATEIO_API_SECRET: ${{ secrets.GATEIO_API_SECRET }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Enable live trading in KV
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys, re

          KEY = "trading_state"

          # Derive KV namespace ID from wrangler.toml so it's always in sync
          KV_NS = None
          try:
              with open("wrangler.toml") as f:
                  for line in f:
                      m = re.search(r'id\s*=\s*"([a-f0-9]{32})"', line)
                      if m:
                          KV_NS = m.group(1)
                          break
          except Exception as e:
              print(f"Could not read wrangler.toml: {e}", file=sys.stderr)

          if not KV_NS:
              print("ERROR: KV namespace ID not found in wrangler.toml", file=sys.stderr)
              sys.exit(1)

          # Try to read existing state so accumulated PnL / trade history is preserved
          state = {}
          try:
              r = subprocess.run(
                  ["npx", "--yes", "wrangler@4", "kv", "key", "get",
                   "--namespace-id", KV_NS, KEY],
                  capture_output=True, text=True
              )
              for line in r.stdout.splitlines():
                  line = line.strip()
                  if line.startswith('{'):
                      state = json.loads(line)
                      break
          except Exception as e:
              print(f"Could not read existing KV state: {e}", file=sys.stderr)

          # Fill in any missing fields with safe defaults
          defaults = {
              "daily_pnl": 0, "daily_trades": 0,
              "total_pnl": 0, "total_trades": 0,
              "initial_capital": 1000,
              "max_daily_loss_usd": 25,
              "min_seconds_between_trades": 30,
              "max_per_trade_loss_pct": 0.02,
              "max_spread_pct": 5.0,
              "win_rate": 0.55,
              "risk_reward_ratio": 2.0,
          }
          for k, v in defaults.items():
              state.setdefault(k, v)

          # Activate live trading
          state["trading_enabled"]  = True
          state["paper_trading"]    = False
          state["auto_stopped"]     = False
          state["auto_stop_reason"] = None

          subprocess.run(
              ["npx", "--yes", "wrangler@4", "kv", "key", "put",
               "--namespace-id", KV_NS, KEY, json.dumps(state)],
              check=True
          )
          print("✅ Live trading enabled in KV")
          PYEOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # At this point the Worker is live and running in real-trade mode.
      # The cron trigger (every minute) will automatically call runScheduledCycle()
      # which scans CEX + Perps opportunities and executes real orders.
      # Monitor progress via Telegram or the Worker dashboard URL shown in
      # the "Deploy Worker" step output above.
      # ─────────────────────────────────────────────────────────────────────────

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete"
          echo "   Worker  : ultimatearbitragehft"
          echo "   Mode    : LIVE (real trading)"
          echo "   Cron    : every minute"
          echo "   Monitor : Telegram bot or Worker dashboard"
