name: Symbol Catalog Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check symbol catalog thresholds
        id: catalog_check
        continue-on-error: true
        run: npm run check:symbol-catalog 2>&1 | tee symbol-catalog-check.log
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          SYMBOL_CATALOG_URL: https://api.ecostamp.net
          MIN_MEXC_SYMBOLS: "1000"
          MIN_BINANCE_SYMBOLS: "250"
          MIN_BITGET_SYMBOLS: "300"
          MIN_METAMASK_SYMBOLS: "1000"
          MIN_SCAN_SYMBOLS: "100"
          BINANCE_REFERENCE_CHECK: "true"
          BINANCE_REFERENCE_OVERRIDE: "true"

      - name: Classify catalog failure
        id: classify
        if: steps.catalog_check.outcome == 'failure'
        run: |
          LOG=symbol-catalog-check.log
          if grep -q 'FAILURE_CLASS=WAF_CHALLENGE' "$LOG" 2>/dev/null; then
            echo "::warning::Symbol catalog check blocked by Cloudflare WAF (FAILURE_CLASS=WAF_CHALLENGE)."
            echo "::warning::This is an infrastructure/access issue — NOT a data regression."
            echo "::warning::Remediation: add GitHub Actions IP ranges to the WAF allowlist for api.ecostamp.net, or configure a proxy."
            echo "failure_class=WAF_CHALLENGE" >> "$GITHUB_OUTPUT"
          else
            # Real data or auth failure — re-surface as an error so the job fails.
            grep 'FAILURE_CLASS=' "$LOG" | head -5 || true
            echo "::error::Symbol catalog threshold check failed with a data or auth error. See log above."
            echo "failure_class=DATA_OR_AUTH" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Telegram alert on failure
        if: steps.classify.outputs.failure_class == 'DATA_OR_AUTH' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf 'UltimateArbitrageHFT symbol catalog alert%%0AThreshold check failed%%0ARun: %s' "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"
