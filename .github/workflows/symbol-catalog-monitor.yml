name: Symbol Catalog Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check symbol catalog thresholds
        run: npm run check:symbol-catalog
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          SYMBOL_CATALOG_URL: https://ultimatearbitragehft.zedanazad43.workers.dev
          MIN_MEXC_SYMBOLS: '1000'
          MIN_BINANCE_SYMBOLS: '250'
          MIN_BITGET_SYMBOLS: '300'
          MIN_METAMASK_SYMBOLS: '1000'
          MIN_SCAN_SYMBOLS: '100'
          BINANCE_REFERENCE_CHECK: 'true'
          BINANCE_REFERENCE_OVERRIDE: 'true'

      - name: Telegram alert on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf 'UltimateArbitrageHFT symbol catalog alert%%0AThreshold check failed%%0ARun: %s' "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"
