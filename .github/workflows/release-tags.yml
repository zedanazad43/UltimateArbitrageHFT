name: Release on Tag

'on':
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hft/go.mod
          cache-dependency-path: hft/go.sum

      - name: Build Linux amd64 HFT binary
        run: |
          mkdir -p dist
          cd hft
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/hft-linux-amd64 ./cmd/hft

      - name: Add checksums
        run: |
          cd dist
          sha256sum hft-linux-amd64 > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hft-linux-amd64
            dist/checksums.txt
