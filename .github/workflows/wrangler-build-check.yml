name: Wrangler Build Check

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  wrangler-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --prefix projects/worker-bot || npm i --prefix projects/worker-bot
      - name: Wrangler dry-run
        run: npx --yes wrangler@4.112.0 deploy --dry-run --env=""
        working-directory: projects/worker-bot
