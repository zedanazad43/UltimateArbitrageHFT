name: Deploy Worker
on:
  push:
    branches: [ main ]
    paths:
      - 'projects/worker-bot/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --prefix projects/worker-bot
      - run: npx --yes wrangler@4.87.0 deploy
        working-directory: projects/worker-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
