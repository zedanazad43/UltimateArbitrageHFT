name: Validate Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "projects/worker-bot/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    paths:
      - "projects/worker-bot/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/worker-bot/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix projects/worker-bot
      - name: Run Worker tests
        run: npm --prefix projects/worker-bot run test:all
      - name: Validate Worker bundle and bindings
        working-directory: projects/worker-bot
        run: npx --yes wrangler@4.87.0 deploy --dry-run
