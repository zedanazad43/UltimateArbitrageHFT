name: Deploy HFT Engine (Containers)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'projects/go-engine/**'
      - '.github/workflows/deploy-engine.yml'

jobs:
  deploy:
    name: Build + Deploy Container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/go-engine/package-lock.json

      - name: Install wrapper worker deps
        run: npm ci --prefix projects/go-engine

      - name: Upload secrets to engine worker
        timeout-minutes: 5
        working-directory: projects/go-engine
        # HFT_ENGINE_SECRET must exist on BOTH the main worker (deploy.yml) and
        # the hft-engine worker so the container can enforce bearer auth. Skipped
        # gracefully when not configured in GitHub repository settings; the
        # container then fails closed (401) until it is added.
        run: |
          python3 - <<'PYEOF'
          import json, os
          keys = ["HFT_ENGINE_SECRET"]
          secrets = {k: os.environ[k] for k in keys if os.environ.get(k)}
          if not secrets:
              print("ℹ️ HFT_ENGINE_SECRET not set in GitHub secrets — engine will fail closed (401) until it is added")
              raise SystemExit(0)
          fd = os.open("/tmp/hft_secrets.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump(secrets, f)
          PYEOF
          if [ -f /tmp/hft_secrets.json ]; then
            npx --yes wrangler@4 secret bulk /tmp/hft_secrets.json
            rm -f /tmp/hft_secrets.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HFT_ENGINE_SECRET: ${{ secrets.HFT_ENGINE_SECRET }}

      - name: Deploy engine container
        id: deploy
        working-directory: projects/go-engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "--- Building image + deploying container (first build is slow) ---"
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          if ! grep -q "Uploaded" /tmp/wrangler-deploy.log && ! grep -qi "success" /tmp/wrangler-deploy.log; then
            echo "::error::Engine container deploy did not report success"
            exit 1
          fi

      - name: Smoke test deployed engine
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HFT_ENGINE_SECRET: ${{ secrets.HFT_ENGINE_SECRET }}
        run: |
          # Strip ANSI (colors + OSC-8 hyperlinks) before extracting the URL.
          URL=$(perl -pe 's/\e\]8;;[^\e]*\e\\//g; s/\e\[[0-9;]*m//g' /tmp/wrangler-deploy.log 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.workers\.dev' | head -1 || true)
          if [ -z "$URL" ]; then
            SUB=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('subdomain',''))" 2>/dev/null || true)
            URL="https://hft-engine.${SUB}.workers.dev"
          fi
          if [ -z "$URL" ] || [ "$URL" = "https://hft-engine..workers.dev" ]; then
            echo "::error::Could not determine engine URL"
            cd projects/go-engine && npx wrangler containers list || true
            exit 1
          fi
          echo "Engine URL: $URL"
          echo "engine_url=$URL" >> "$GITHUB_OUTPUT"
          echo "--- Restarting container so it picks up freshly uploaded secrets/env ---"
          for i in $(seq 1 5); do
            if [ -n "$HFT_ENGINE_SECRET" ]; then
              RESTART_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST -H "Authorization: Bearer $HFT_ENGINE_SECRET" "$URL/__admin/restart" || true)
            else
              RESTART_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL/__admin/restart" || true)
            fi
            echo "restart probe $i: POST /__admin/restart -> HTTP $RESTART_CODE"
            if [ "$RESTART_CODE" = "200" ]; then
              break
            fi
            sleep 10
          done
          echo "--- Waiting for container provisioning (cold start can take minutes) ---"
          HEALTHY=""
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/engine-health.json -w '%{http_code}' --max-time 30 "$URL/api/health" || true)
            echo "probe $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Engine healthy:"
              cat /tmp/engine-health.json
              echo
              HEALTHY=1
              break
            fi
            sleep 30
          done
          if [ -z "$HEALTHY" ]; then
            echo "::error::Engine did not become healthy within 10 minutes"
            cat /tmp/engine-health.json 2>/dev/null || true
            exit 1
          fi
          # Auth must be enforced on trading endpoints even without a secret
          # (fail-closed: ENGINE_REQUIRE_AUTH=true on the container). Health can
          # come up on the PREVIOUS image while the container rollout replaces
          # instances, so retry the auth probe until the new image serves.
          SCAN_CODE=""
          for i in $(seq 1 10); do
            SCAN_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/api/scan" || true)
            echo "probe $i: unauthenticated /api/scan -> HTTP $SCAN_CODE (expect 401)"
            if [ "$SCAN_CODE" = "401" ]; then
              break
            fi
            sleep 30
          done
          if [ "$SCAN_CODE" != "401" ]; then
            echo "::error::Expected 401 from unauthenticated /api/scan, got $SCAN_CODE (rollout may still be replacing instances)"
            exit 1
          fi
          echo "✅ Engine fail-closed auth verified (401 without token)"
          # When the secret IS configured, a valid bearer must be accepted.
          if [ -n "$HFT_ENGINE_SECRET" ]; then
            AUTH_CODE=""
            for i in $(seq 1 6); do
              AUTH_CODE=$(curl -s -o /tmp/engine-scan.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $HFT_ENGINE_SECRET" "$URL/api/scan" || true)
              echo "probe $i: authenticated /api/scan -> HTTP $AUTH_CODE (expect 200)"
              if [ "$AUTH_CODE" = "200" ]; then
                break
              fi
              sleep 30
            done
            if [ "$AUTH_CODE" != "200" ]; then
              echo "::error::Expected 200 from authenticated /api/scan, got $AUTH_CODE"
              exit 1
            fi
            echo "✅ Engine bearer auth verified"
          else
            echo "ℹ️ HFT_ENGINE_SECRET not configured — skipping authenticated probe (engine stays fail-closed)"
          fi

      - name: Confirm container status
        working-directory: projects/go-engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 containers list || true