name: Deploy Pages
on:
  push:
    branches: [ main ]
    paths:
      - 'projects/dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd projects/dashboard && npm ci || npm install
      - run: cd projects/dashboard && npm run build
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 652e53f35781522e2745784cc4425d9d
          projectName: ultimate-arbitrage-frontend
          directory: projects/dashboard/build
