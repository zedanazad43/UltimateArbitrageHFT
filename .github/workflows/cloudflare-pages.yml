# Deploy the React frontend to Cloudflare Pages (free tier)
name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: CI=false npm run build

      - name: Add SPA fallback for Cloudflare Pages
        run: printf '/*    /index.html   200\n' > frontend/build/_redirects

      - name: Create Cloudflare Pages project (if missing)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 652e53f35781522e2745784cc4425d9d
          command: pages project create ultimate-arbitrage-frontend --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 652e53f35781522e2745784cc4425d9d
          command: pages deploy frontend/build --project-name=ultimate-arbitrage-frontend --commit-dirty=true
