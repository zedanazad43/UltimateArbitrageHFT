name: Validate Cloudflare Pages frontend

on:
  push:
    branches: [main]
    paths:
      - "projects/dashboard/**"
      - ".github/workflows/cloudflare-pages.yml"
  pull_request:
    paths:
      - "projects/dashboard/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/dashboard/package-lock.json
      - name: Install frontend dependencies
        working-directory: projects/dashboard
        run: npm ci
      - name: Type-check frontend
        working-directory: projects/dashboard
        run: npm run typecheck
      - name: Build frontend
        working-directory: projects/dashboard
        env:
          VITE_BACKEND_URL: https://api.ecostamp.net
        run: npm run build
      - name: Verify Pages build output
        run: test -f projects/dashboard/build/index.html
