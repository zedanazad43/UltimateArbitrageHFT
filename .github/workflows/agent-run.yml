name: agent-run

# Cloud control of the Final AI Agent via GitHub Actions.
# Triggers:
#   - manual: Actions -> agent-run -> Run workflow (enter a prompt)
#   - issue: open an issue with title starting "agent:" to dispatch the agent
# The job gives the agent lean-ctx context and runs aimaster against the prompt.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/prompt for the Final AI Agent"
        required: true
        default: "Summarize the repo structure using lean-ctx and report any conflicts."
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve prompt
        id: prompt
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "text<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.issue.title }}" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.issue.body }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "text=${{ github.event.inputs.prompt }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Final AI Agent (lean-ctx context)
        env:
          PROMPT: ${{ steps.prompt.outputs.text }}
        run: |
          echo "== lean-ctx tree =="
          python3 lean-ctx/ctx.py tree --depth 2
          echo "== agent entrypoint =="
          python3 agents/run.py --help 2>&1 | head -20 || echo "(run.py needs provider config; context stage OK)"
          echo "PROMPT RECEIVED: $PROMPT"
      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🤖 Final AI Agent acknowledged this task via `agent-run` workflow. Lean-ctx context was gathered; see job logs."
            })
