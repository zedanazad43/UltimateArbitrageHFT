name: Spot Lock Daily Report

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run short monitor snapshot
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: https://api.ecostamp.net
        run: |
          set -o pipefail
          npm run monitor:spot-lock -- \
            --samples 4 \
            --interval-ms 5000 \
            --fetch-retries 1 \
            --retry-delay-ms 500 \
            --base "$API_BASE" | tee daily-spot-lock.log

      - name: Build daily report payload
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const now = new Date();
            const since = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'spot-lock-monitor.yml',
              per_page: 100,
            });

            const recent = runs.filter((r) => new Date(r.created_at).toISOString() >= since);
            const successCount = recent.filter((r) => r.conclusion === 'success').length;
            const failureCount = recent.filter((r) => r.conclusion === 'failure').length;

            const log = fs.existsSync('daily-spot-lock.log')
              ? fs.readFileSync('daily-spot-lock.log', 'utf8')
              : '';
            const summaryLine = log.split(/\r?\n/).find((line) => line.startsWith('SPOT_LOCK_MONITOR_SUMMARY '));
            const sampleLines = log.split(/\r?\n/).filter((line) => line.startsWith('SAMPLE '));

            let summary = null;
            if (summaryLine) {
              try {
                summary = JSON.parse(summaryLine.slice('SPOT_LOCK_MONITOR_SUMMARY '.length));
              } catch {
                summary = null;
              }
            }

            let lastSample = null;
            if (sampleLines.length) {
              try {
                lastSample = JSON.parse(sampleLines[sampleLines.length - 1].slice('SAMPLE '.length));
              } catch {
                lastSample = null;
              }
            }

            const payload = {
              generatedAt: now.toISOString(),
              monitorRuns24h: recent.length,
              monitorRuns24hSuccess: successCount,
              monitorRuns24hFailure: failureCount,
              networkFailures: Number(summary?.networkFailures ?? 0),
              stateFailures: Number(summary?.stateFailures ?? 0),
              readyForLive: lastSample?.readyForLive === true,
            };

            fs.writeFileSync('daily-spot-lock-report.json', JSON.stringify(payload, null, 2));

            const md = [
              '## Spot Lock Daily Report',
              '',
              `- Generated: ${payload.generatedAt}`,
              `- Monitor runs (24h): ${payload.monitorRuns24h}`,
              `- Monitor runs success (24h): ${payload.monitorRuns24hSuccess}`,
              `- Monitor runs failure (24h): ${payload.monitorRuns24hFailure}`,
              `- State failures (snapshot): ${payload.stateFailures}`,
              `- Network failures (snapshot): ${payload.networkFailures}`,
              `- Ready for live (snapshot): ${payload.readyForLive}`,
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${md}\n`);

            core.setOutput('message', md);
            core.setOutput('state_failures', String(payload.stateFailures));
            core.setOutput('network_failures', String(payload.networkFailures));
            core.setOutput('ready_for_live', String(payload.readyForLive));

      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-lock-daily-report-${{ github.run_id }}
          path: |
            daily-spot-lock.log
            daily-spot-lock-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Telegram daily report
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          text=$(cat <<'TXT'
${{ steps.report.outputs.message }}
TXT
)

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true"
