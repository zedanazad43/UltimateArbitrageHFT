# One-time Cloudflare setup: attach custom domains + remove dead services.
# Triggered manually (gh workflow run cloudflare-setup.yml).
name: Cloudflare setup (domains + cleanup)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCT: 652e53f35781522e2745784cc4425d9d

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Attach frontend custom domain (app.ecostamp.net)
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/ultimate-arbitrage-frontend/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"app.ecostamp.net"}'

      - name: Attach worker custom domain (api.ecostamp.net)
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"api.ecostamp.net","environment":"production","service":"ultimatearbitragehft","zone_name":"ecostamp.net"}'

      - name: Remove dead Workers (ai-router, hero-api)
        continue-on-error: true
        run: |
          for w in ai-router hero-api; do
            echo ">> delete worker: $w"
            curl -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$w" \
              -H "Authorization: Bearer $CF_TOKEN"
            echo
          done

      - name: Confirm domain binding status
        continue-on-error: true
        run: |
          echo "== frontend domains =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/ultimate-arbitrage-frontend/domains" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' ', x.get('name'), x.get('status')) for x in d.get('result',[])]"
          echo "== worker routes/domains =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/domains" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' ', x.get('name'), x.get('environment'), x.get('service')) for x in d.get('result',[])]"

      - name: Verify remaining services
        run: |
          echo "== Workers & Pages =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' pages:', p['name']) for p in d.get('result',[])]"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' worker:', s['id']) for s in d.get('result',[])]"
