name: Refresh Bitget Fallback Symbols

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Bitget fallback list
        run: npm run refresh:bitget-fallback

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- src/data/bitget-symbols-fallback.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bitget-symbols-fallback.js
          git commit -m "chore(data): refresh Bitget fallback symbols"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "Updated and pushed src/data/bitget-symbols-fallback.js"
          else
            echo "No Bitget fallback changes detected"
          fi
