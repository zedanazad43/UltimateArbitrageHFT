name: Spot Lock Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "10 0 * * *"
    - cron: "20 0 * * 1"
  workflow_dispatch:
    inputs:
      samples:
        description: Number of samples to collect
        required: false
        default: "2"
      interval_ms:
        description: Delay between samples in milliseconds
        required: false
        default: "5000"
      fetch_retries:
        description: Retries for transient fetch failures
        required: false
        default: "1"
      retry_delay_ms:
        description: Delay between fetch retries in milliseconds
        required: false
        default: "500"
      base_url:
        description: Base URL for protected monitor checks
        required: false
        default: "https://api.ecostamp.net"

permissions:
  contents: read
  actions: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    name: Spot-Lock 15m Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run spot-lock monitor
        id: monitor
        continue-on-error: true
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ github.event.inputs.base_url || 'https://api.ecostamp.net' }}
          INPUT_SAMPLES: ${{ github.event.inputs.samples || '2' }}
          INPUT_INTERVAL_MS: ${{ github.event.inputs.interval_ms || '5000' }}
          INPUT_FETCH_RETRIES: ${{ github.event.inputs.fetch_retries || '1' }}
          INPUT_RETRY_DELAY_MS: ${{ github.event.inputs.retry_delay_ms || '500' }}
        run: |
          set -o pipefail
          npm run monitor:spot-lock -- \
            --samples "$INPUT_SAMPLES" \
            --interval-ms "$INPUT_INTERVAL_MS" \
            --fetch-retries "$INPUT_FETCH_RETRIES" \
            --retry-delay-ms "$INPUT_RETRY_DELAY_MS" \
            --base "$API_BASE" | tee spot-lock-monitor.log

      - name: Parse monitor summary
        id: parse
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function setOutput(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }

          const logPath = 'spot-lock-monitor.log';
          const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : '';
          const summaryLine = log.split(/\r?\n/).find((line) => line.startsWith('SPOT_LOCK_MONITOR_SUMMARY '));
          const sampleLines = log.split(/\r?\n/).filter((line) => line.startsWith('SAMPLE '));

          let summary = null;
          if (summaryLine) {
            try {
              summary = JSON.parse(summaryLine.slice('SPOT_LOCK_MONITOR_SUMMARY '.length));
            } catch {
              summary = null;
            }
          }

          let lastSample = null;
          if (sampleLines.length > 0) {
            const lastLine = sampleLines[sampleLines.length - 1];
            try {
              lastSample = JSON.parse(lastLine.slice('SAMPLE '.length));
            } catch {
              lastSample = null;
            }
          }

          if (!summary) {
            summary = {
              strictFailures: 1,
              stateFailures: 1,
              accessFailures: 0,
              networkFailures: 0,
              strictStable: false,
              stateStable: false,
              accessStable: true,
              networkStable: true,
            };
          }

          fs.writeFileSync('spot-lock-summary.json', JSON.stringify({
            summary,
            lastSample,
            parsedAt: new Date().toISOString(),
          }, null, 2));

          setOutput('strict_failures', String(summary.strictFailures ?? 0));
          setOutput('state_failures', String(summary.stateFailures ?? 0));
          setOutput('access_failures', String(summary.accessFailures ?? 0));
          setOutput('network_failures', String(summary.networkFailures ?? 0));
          setOutput('state_stable', String(summary.stateStable === true));
          setOutput('ready_for_live', String(lastSample?.readyForLive === true));
          NODE

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-lock-monitor-${{ github.run_id }}
          path: |
            spot-lock-monitor.log
            spot-lock-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "## Spot Lock Monitor";
            echo "";
            echo "- State failures: ${{ steps.parse.outputs.state_failures }}";
            echo "- Access failures: ${{ steps.parse.outputs.access_failures }}";
            echo "- Network failures: ${{ steps.parse.outputs.network_failures }}";
            echo "- Ready for live (last sample): ${{ steps.parse.outputs.ready_for_live }}";
            echo "- State stable: ${{ steps.parse.outputs.state_stable }}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram critical alert (state failure)
        if: always() && steps.parse.outputs.state_failures != '0' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          text=$(printf 'CRITICAL: Spot-lock state failure detected\nRepo: %s\nRun: %s\nstateFailures=%s networkFailures=%s' \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${{ steps.parse.outputs.state_failures }}" \
            "${{ steps.parse.outputs.network_failures }}")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true"

      - name: Escalate on consecutive state failures
        if: always() && steps.parse.outputs.state_failures != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'spot-lock-monitor.yml',
              per_page: 20,
            });

            const previousCompleted = runs
              .filter((r) => r.id !== currentRunId && r.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const prev = previousCompleted[0];
            if (!prev || prev.conclusion !== 'failure') {
              core.info('No consecutive failure detected. Escalation issue not created.');
              return;
            }

            const title = 'P1: Consecutive spot-lock state failures';
            const body = [
              'Automated escalation detected two consecutive failed `Spot Lock Monitor` runs.',
              '',
              `Current run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${currentRunId}`,
              `Previous failed run: ${prev.html_url}`,
              '',
              'Immediate actions:',
              '1. Run smoke guardrails (`smoke:all-guards`).',
              '2. Verify `/api/safety-state` and `/api/readiness`.',
              '3. Re-enforce lock and freeze risky config changes until stable.',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'spot-lock-incident',
              per_page: 50,
            });

            if (openIssues.length > 0) {
              const throttleWindowMs = 60 * 60 * 1000;
              const since = new Date(Date.now() - throttleWindowMs).toISOString();
              const recentComments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: openIssues[0].number,
                since,
                per_page: 1,
              });
              if (recentComments.data.length > 0) {
                const lastCommentAt = new Date(recentComments.data[0].created_at);
                const nextAllowedAt = new Date(lastCommentAt.getTime() + throttleWindowMs);
                const waitMinutes = Math.max(1, Math.ceil((nextAllowedAt - Date.now()) / 60000));
                core.info(`Throttled: incident issue #${openIssues[0].number} already has a comment in the last 60 min. Next comment allowed in ~${waitMinutes} min.`);
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: openIssues[0].number,
                body,
              });
              core.info(`Updated existing incident issue #${openIssues[0].number}.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['spot-lock-incident', 'ops', 'priority:p1'],
            });

            core.info(`Created incident issue #${created.data.number}.`);

      - name: Resolve open incident on recovery
        if: always() && steps.parse.outputs.state_failures == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'spot-lock-incident',
              per_page: 50,
            });

            if (openIssues.length === 0) {
              core.info('No open spot-lock incident issue to close.');
              return;
            }

            const issue = openIssues[0];
            const body = [
              'Automated recovery detected: `Spot Lock Monitor` returned to a healthy state.',
              '',
              `Recovery run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              'stateFailures=0',
              `networkFailures=${{ steps.parse.outputs.network_failures }}`,
              '',
              'The incident is being closed automatically. Review the recovery run and artifacts if follow-up is still needed.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
            });

            core.info(`Closed recovered incident issue #${issue.number}.`);

      - name: Telegram warning alert (network/access only)
        if: always() && steps.parse.outputs.state_failures == '0' && (steps.parse.outputs.network_failures != '0' || steps.parse.outputs.access_failures != '0') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          text=$(printf 'WARNING: Spot-lock monitor saw transient network/access failures\nRepo: %s\nRun: %s\naccessFailures=%s networkFailures=%s stateFailures=%s' \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${{ steps.parse.outputs.access_failures }}" \
            "${{ steps.parse.outputs.network_failures }}" \
            "${{ steps.parse.outputs.state_failures }}")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true"

      - name: Fail job on state failure
        if: always() && steps.parse.outputs.state_failures != '0'
        run: |
          echo "Spot-lock state failure detected."
          exit 1

  daily-report:
    if: github.event.schedule == '10 0 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.samples == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run short monitor snapshot
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: https://api.ecostamp.net
        run: |
          set -o pipefail
          npm run monitor:spot-lock -- \
            --samples 4 \
            --interval-ms 5000 \
            --fetch-retries 1 \
            --retry-delay-ms 500 \
            --base "$API_BASE" | tee daily-spot-lock.log

      - name: Build daily report payload
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const now = new Date();
            const since = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'spot-lock-monitor.yml',
              per_page: 100,
            });

            const recent = runs.filter((r) => new Date(r.created_at).toISOString() >= since);
            const successCount = recent.filter((r) => r.conclusion === 'success').length;
            const failureCount = recent.filter((r) => r.conclusion === 'failure').length;

            const log = fs.existsSync('daily-spot-lock.log')
              ? fs.readFileSync('daily-spot-lock.log', 'utf8')
              : '';
            const summaryLine = log.split(/\r?\n/).find((line) => line.startsWith('SPOT_LOCK_MONITOR_SUMMARY '));
            const sampleLines = log.split(/\r?\n/).filter((line) => line.startsWith('SAMPLE '));

            let summary = null;
            if (summaryLine) {
              try {
                summary = JSON.parse(summaryLine.slice('SPOT_LOCK_MONITOR_SUMMARY '.length));
              } catch {
                summary = null;
              }
            }

            let lastSample = null;
            if (sampleLines.length) {
              try {
                lastSample = JSON.parse(sampleLines[sampleLines.length - 1].slice('SAMPLE '.length));
              } catch {
                lastSample = null;
              }
            }

            const payload = {
              generatedAt: now.toISOString(),
              monitorRuns24h: recent.length,
              monitorRuns24hSuccess: successCount,
              monitorRuns24hFailure: failureCount,
              networkFailures: Number(summary?.networkFailures ?? 0),
              stateFailures: Number(summary?.stateFailures ?? 0),
              readyForLive: lastSample?.readyForLive === true,
            };

            fs.writeFileSync('daily-spot-lock-report.json', JSON.stringify(payload, null, 2));

            const md = [
              '## Spot Lock Daily Report',
              '',
              `- Generated: ${payload.generatedAt}`,
              `- Monitor runs (24h): ${payload.monitorRuns24h}`,
              `- Monitor runs success (24h): ${payload.monitorRuns24hSuccess}`,
              `- Monitor runs failure (24h): ${payload.monitorRuns24hFailure}`,
              `- State failures (snapshot): ${payload.stateFailures}`,
              `- Network failures (snapshot): ${payload.networkFailures}`,
              `- Ready for live (snapshot): ${payload.readyForLive}`,
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${md}\n`);

            core.setOutput('message', md);

      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-lock-daily-report-${{ github.run_id }}
          path: |
            daily-spot-lock.log
            daily-spot-lock-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Telegram daily report
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          text="${{ steps.report.outputs.message }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true"

  weekly-report:
    if: github.event.schedule == '20 0 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weekly snapshot
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: https://api.ecostamp.net
        run: |
          set -o pipefail
          npm run monitor:spot-lock -- \
            --samples 4 \
            --interval-ms 5000 \
            --fetch-retries 1 \
            --retry-delay-ms 500 \
            --base "$API_BASE" | tee weekly-spot-lock.log

      - name: Build weekly report payload
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const now = new Date();
            const since = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'spot-lock-monitor.yml',
              per_page: 100,
            });

            const recent = runs.filter((r) => new Date(r.created_at).toISOString() >= since);
            const successCount = recent.filter((r) => r.conclusion === 'success').length;
            const failureCount = recent.filter((r) => r.conclusion === 'failure').length;
            const totalCount = recent.length;
            const availabilityPct = totalCount === 0 ? 100 : Number(((successCount / totalCount) * 100).toFixed(2));

            const log = fs.existsSync('weekly-spot-lock.log')
              ? fs.readFileSync('weekly-spot-lock.log', 'utf8')
              : '';
            const summaryLine = log.split(/\r?\n/).find((line) => line.startsWith('SPOT_LOCK_MONITOR_SUMMARY '));
            const sampleLines = log.split(/\r?\n/).filter((line) => line.startsWith('SAMPLE '));

            let summary = null;
            if (summaryLine) {
              try {
                summary = JSON.parse(summaryLine.slice('SPOT_LOCK_MONITOR_SUMMARY '.length));
              } catch {
                summary = null;
              }
            }

            let lastSample = null;
            if (sampleLines.length) {
              try {
                lastSample = JSON.parse(sampleLines[sampleLines.length - 1].slice('SAMPLE '.length));
              } catch {
                lastSample = null;
              }
            }

            const payload = {
              generatedAt: now.toISOString(),
              monitorRuns7d: totalCount,
              monitorRuns7dSuccess: successCount,
              monitorRuns7dFailure: failureCount,
              availabilityPct,
              networkFailuresSnapshot: Number(summary?.networkFailures ?? 0),
              stateFailuresSnapshot: Number(summary?.stateFailures ?? 0),
              readyForLiveSnapshot: lastSample?.readyForLive === true,
            };

            fs.writeFileSync('weekly-spot-lock-report.json', JSON.stringify(payload, null, 2));

            const md = [
              '## Spot Lock Weekly Report',
              '',
              `- Generated: ${payload.generatedAt}`,
              `- Monitor runs (7d): ${payload.monitorRuns7d}`,
              `- Monitor runs success (7d): ${payload.monitorRuns7dSuccess}`,
              `- Monitor runs failure (7d): ${payload.monitorRuns7dFailure}`,
              `- Monitor availability (7d): ${payload.availabilityPct}%`,
              `- State failures (snapshot): ${payload.stateFailuresSnapshot}`,
              `- Network failures (snapshot): ${payload.networkFailuresSnapshot}`,
              `- Ready for live (snapshot): ${payload.readyForLiveSnapshot}`,
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${md}\n`);
            core.setOutput('message', md);

      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-lock-weekly-report-${{ github.run_id }}
          path: |
            weekly-spot-lock.log
            weekly-spot-lock-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Telegram weekly report
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          text="${{ steps.report.outputs.message }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true"
