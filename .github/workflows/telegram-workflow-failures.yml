name: Telegram Workflow Failure Alerts

'on':
  workflow_run:
    workflows:
      - "Node.js CI"
      - "Deploy Worker"
      - "Deploy static content to Pages"
      - "Production Monitoring and Operations"
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping alert."
            exit 0
          fi

          short_sha=$(echo "$SHA" | cut -c1-7)
          text=$(printf 'UltimateArbitrageHFT alert%%0AWorkflow failed: %s%%0ARepo: %s%%0ABranch: %s%%0ASHA: %s%%0ARun: %s' "$WORKFLOW_NAME" "$REPO" "$BRANCH" "$short_sha" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"
