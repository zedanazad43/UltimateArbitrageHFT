name: Hero-Super-Agent Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'hero-super-agent/**'
      - '.github/workflows/hero-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install hero-super-agent dependencies
        run: |
          cd hero-super-agent/packages/cloudflare
          npm ci
          cd ../../..

      - name: Build Cloudflare package
        run: |
          cd hero-super-agent/packages/cloudflare
          npm run build 2>/dev/null || echo "No build script"
          cd ../../..

      - name: Deploy to Cloudflare
        run: |
          cd hero-super-agent/packages/cloudflare
          wrangler deploy
          cd ../../..
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build and deploy API (if applicable)
        run: |
          if [ -f "hero-super-agent/packages/api/package.json" ]; then
            cd hero-super-agent/packages/api
            npm ci
            npm run build 2>/dev/null || echo "No build script"
            npm run deploy 2>/dev/null || echo "No deploy script"
            cd ../../..
          fi

      - name: Notify Telegram
        if: success()
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Hero-Super-Agent deployed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Hero-Super-Agent deployment failed"
