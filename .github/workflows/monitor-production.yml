name: Production Monitoring and Operations

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "*/15 * * * *"
    - cron: "0 2 * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ops_alert_webhook:
        description: Optional external webhook URL for failure alerts
        required: false
        type: string
        default: ""
      run_self_evaluation:
        description: Run strategy self-evaluation during a manual dispatch
        required: false
        type: boolean
        default: false
      simulate_failure:
        description: Force smoke test failure to validate Telegram alert delivery
        required: false
        type: boolean
        default: true
      base_url:
        description: Worker base URL (used by smoke test)
        required: false
        type: string
        default: https://api.ecostamp.net

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production monitor
        id: monitor
        run: node scripts/monitor-performance.js

      - name: Upload metrics artifact
        if: always() && steps.monitor.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-metrics-${{ github.run_id }}
          path: metrics.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Create or update outage issue
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production monitoring alert: degraded health or latency';
            const body = [
              'Automated monitoring detected a production issue.',
              '',
              `Time: ${new Date().toISOString()}`,
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Actions:',
              '1. Inspect latest metrics artifact.',
              '2. Check Cloudflare Worker logs and D1 connectivity.',
              '3. Verify auth/login and /health endpoint behavior.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert'
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['production-alert', 'ops']
              });
            }

      - name: Optional external webhook alert
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.ops_alert_webhook != ''
        env:
          OPS_ALERT_WEBHOOK: ${{ inputs.ops_alert_webhook }}
        run: |
          payload='{"text":"UltimateArbitrageHFT monitoring alert: production health check failed."}'
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$OPS_ALERT_WEBHOOK"

      - name: Telegram alert on monitoring failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          payload=$(printf '{"chat_id":"%s","text":"%s"}' "$TELEGRAM_CHAT_ID" 'UltimateArbitrageHFT monitoring alert: production health check failed.')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

  backup-nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        shell: pwsh
        run: ./scripts/backup-database.ps1 -Full -Verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload backup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backups-${{ github.run_id }}
          path: |
            backups
            logs
          retention-days: 14

  security-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run audit:security

  self-evaluate-weekly:
    if: github.event.schedule == '0 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run_self_evaluation)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run strategy self-evaluation
        run: npm run self:evaluate
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SELF_EVAL_BASE_URL: https://api.ecostamp.net

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-evaluation-${{ github.run_id }}
          path: strategy-evaluation.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Telegram alert on self-evaluation failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          payload=$(printf '{"chat_id":"%s","text":"%s"}' "$TELEGRAM_CHAT_ID" 'UltimateArbitrageHFT self-evaluation failed. Check the workflow logs and artifact state.')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

  smoke-alert-test:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production endpoint smoke test
        id: smoke
        continue-on-error: true
        env:
          WORKFLOW_ADMIN_TOKEN_SECRET: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
          BASE_URL: ${{ inputs.base_url || 'https://api.ecostamp.net' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scheduled runs should always execute a real smoke check.
          if [ "$EVENT_NAME" = "schedule" ]; then
            SIMULATE_FAILURE="false"
          fi

          token="$WORKFLOW_ADMIN_TOKEN_SECRET"
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            token="invalid-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
            echo "Simulating failure with invalid admin token"
          fi

          WORKFLOW_ADMIN_TOKEN="$token" BASE_URL="$BASE_URL" EXPECTED_WORKER_NAME="ultimatearbitragehft" REQUIRE_READY_FOR_LIVE="false" SKIP_CUSTOM_DOMAIN_CHECK="true" node ./scripts/verify-production-endpoints.js

      - name: Telegram alert when smoke test fails
        if: steps.smoke.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping alert."
            exit 0
          fi

          short_sha=$(echo "$SHA" | cut -c1-7)
          text=$(printf 'Smoke alert test failed%%0ASimulated: %s%%0ABranch: %s%%0ASHA: %s%%0ARun: %s' "$SIMULATE_FAILURE" "$BRANCH" "$short_sha" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"

      - name: Finalize status
        if: always()
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            SIMULATE_FAILURE="false"
          fi

          echo "Smoke outcome: $SMOKE_OUTCOME"
          if [ "$SMOKE_OUTCOME" = "failure" ] && [ "$SIMULATE_FAILURE" != "true" ]; then
            echo "Real smoke test failed"
            exit 1
          fi
          echo "Workflow completed"
