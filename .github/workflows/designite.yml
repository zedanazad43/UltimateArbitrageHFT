name: Designite Java Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Run JS-based actions under Node.js 24 (consistent with other workflows in this repo)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: Designite Java Analysis
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Run Designite Java
        uses: DesigniteTools/DJAction@v2.4.1
        with:
          PAT: ${{ secrets.PAT }}
          D_KEY: ${{ secrets.D_KEY }}
          API_KEY: ${{ secrets.DCODE_API_KEY }}
          PROJECT_ID: ${{ secrets.DCODE_PROJECT_ID }}
          Input: ./src
          Output: ./designite-output
