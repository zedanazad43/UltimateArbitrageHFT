name: World-class CI/CD Bot

on:
  push:
    branches: [main, develop, staging, "release/**"]
  pull_request:
    branches: [main, staging, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'

# ─────────────────────────────────────────────────────────────────────────────
# 1. LINT
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

# ─────────────────────────────────────────────────────────────────────────────
# 2. SECURITY AUDIT
# ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: Security audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high

# ─────────────────────────────────────────────────────────────────────────────
# 3. UNIT + INTEGRATION TESTS
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint, audit]
    strategy:
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-node${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# 4. BUILD (validate bundle compiles)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (dry-run wrangler)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run bundle check
        # `wrangler deploy --dry-run` validates the Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: worker-bundle
          path: |
            index.js
            src/
            migrations/
            wrangler.toml
            package.json
          if-no-files-found: error
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# 5. DEPLOY — STAGING  (push to staging branch only)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging Worker
        run: |
          for attempt in 1 2 3; do
            echo "--- Staging deploy attempt $attempt/3 ---"
            if npx --yes wrangler@4 deploy --env staging; then
              echo "✅ Staging deployed on attempt $attempt"
              exit 0
            fi
            [ $attempt -lt 3 ] && sleep 15
          done
          echo "::error::Staging deployment failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 6. DEPLOY — PRODUCTION  (push to main, with environment approval gate)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production (with approval)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://ultimatearbitragehft.zedanazad43.workers.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker (production, 3 retries)
        run: |
          for attempt in 1 2 3; do
            echo "--- Production deploy attempt $attempt/3 ---"
            if npx --yes wrangler@4 deploy; then
              echo "✅ Production deployed on attempt $attempt"
              exit 0
            fi
            [ $attempt -lt 3 ] && sleep 15
          done
          echo "::error::Production deployment failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production secrets (critical + optional)
        run: |
          critical_missing=0
          optional_missing=()

          for key in WORKFLOW_ADMIN_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing critical GitHub environment secret: $key"
              critical_missing=1
            fi
          done

          for key in \
            MEXC_API_KEY MEXC_API_SECRET \
            BINANCE_API_KEY BINANCE_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_PASSPHRASE \
            KUCOIN_API_KEY KUCOIN_SECRET_KEY KUCOIN_PASSPHRASE \
            COINBASE_API_KEY COINBASE_SECRET_KEY \
            BITGET_API_KEY BITGET_SECRET_KEY BITGET_API_PASSPHRASE \
            BITMART_API_KEY BITMART_SECRET_KEY BITMART_MEMO \
            ZEROX_API_KEY ALCHEMY_API_KEY \
            TEMPORAL_API_KEY
          do
            if [ -z "${!key}" ]; then
              optional_missing+=("$key")
            fi
          done

          if [ ${#optional_missing[@]} -gt 0 ]; then
            echo "::notice::Optional secrets not set (${#optional_missing[@]}): ${optional_missing[*]}"
          else
            echo "✅ All optional integration secrets are configured."
          fi

          if [ "$critical_missing" -eq 1 ]; then
            echo "::notice::Critical secrets are missing in GitHub environment; deployment may still pass if values are set directly in Cloudflare Worker."
          else
            echo "✅ Critical production secrets are present in GitHub environment."
          fi
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET_KEY: ${{ secrets.KUCOIN_SECRET_KEY }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_SECRET_KEY: ${{ secrets.COINBASE_SECRET_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
          BITMART_SECRET_KEY: ${{ secrets.BITMART_SECRET_KEY }}
          BITMART_MEMO: ${{ secrets.BITMART_MEMO }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}

      - name: Verify Cloudflare-only optional secret names
        run: |
          raw="$(npx --yes wrangler@4 secret list --name ultimatearbitragehft)"
          export WORKER_SECRETS_RAW="$raw"
          node - <<'NODE'
          const raw = process.env.WORKER_SECRETS_RAW || '';
          const start = raw.indexOf('[');
          const end = raw.lastIndexOf(']');
          if (start === -1 || end === -1 || end <= start) {
            console.log('::warning::Unable to parse Cloudflare secret list output.');
            process.exit(0);
          }

          let list;
          try {
            list = JSON.parse(raw.slice(start, end + 1));
          } catch {
            console.log('::warning::Cloudflare secret list is not valid JSON payload.');
            process.exit(0);
          }

          const have = new Set((list || []).map((x) => x && x.name).filter(Boolean));
          const required = [
            'BYBIT_API_KEY',
            'BYBIT_API_SECRET',
            'GATEIO_API_KEY',
            'GATEIO_API_SECRET',
            'HTX_API_KEY',
            'HTX_API_SECRET',
            'HFT_ENGINE_SECRET'
          ];

          const missing = required.filter((name) => !have.has(name));
          if (missing.length) {
            console.log(`::notice::Cloudflare optional secret names missing (${missing.length}): ${missing.join(' ')}`);
          } else {
            console.log('✅ Cloudflare-only optional secret names are present.');
          }
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Enable live trading in KV
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys, re
          KEY = "trading_state"
          KV_NS = None
          try:
              with open("wrangler.toml") as f:
                  for line in f:
                      m = re.search(r'id\s*=\s*"([a-f0-9]{32})"', line)
                      if m:
                          KV_NS = m.group(1)
                          break
          except Exception as e:
              print(f"Could not read wrangler.toml: {e}", file=sys.stderr)
          if not KV_NS:
              print("ERROR: KV namespace ID not found in wrangler.toml", file=sys.stderr)
              sys.exit(1)
          state = {}
          try:
              r = subprocess.run(
                  ["npx", "--yes", "wrangler@4", "kv", "key", "get",
                   "--namespace-id", KV_NS, KEY],
                  capture_output=True, text=True
              )
              for line in r.stdout.splitlines():
                  line = line.strip()
                  if line.startswith('{'):
                      state = json.loads(line)
                      break
          except Exception as e:
              print(f"Could not read existing KV state: {e}", file=sys.stderr)
          defaults = {
              "daily_pnl": 0, "daily_trades": 0,
              "total_pnl": 0, "total_trades": 0,
              "initial_capital": 1000,
              "max_daily_loss_usd": 25,
              "min_seconds_between_trades": 30,
              "max_per_trade_loss_pct": 0.02,
              "max_spread_pct": 5.0,
              "win_rate": 0.55,
              "risk_reward_ratio": 2.0,
          }
          for k, v in defaults.items():
              state.setdefault(k, v)
          state["trading_enabled"] = True
          state["paper_trading"] = False
          state["auto_stopped"] = False
          state["auto_stop_reason"] = None
          subprocess.run(
              ["npx", "--yes", "wrangler@4", "kv", "key", "put",
               "--namespace-id", KV_NS, KEY, json.dumps(state)],
              check=True
          )
          print("✅ Live trading enabled in KV")
          PYEOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy endpoint smoke test
        id: smoke_test
        run: |
          for attempt in 1 2 3 4; do
            echo "--- Smoke check attempt $attempt/4 ---"
            if node ./scripts/verify-production-endpoints.js; then
              echo "✅ Smoke check passed on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 4 ]; then
              echo "⚠️ Smoke check failed, retrying in 15s..."
              sleep 15
            fi
          done
          echo "::error::Smoke check failed after 4 attempts."
          exit 1
        env:
          WORKFLOW_ADMIN_TOKEN: ${{ secrets.WORKFLOW_ADMIN_TOKEN }}
          EXPECTED_WORKER_NAME: ultimatearbitragehft
          REQUIRE_READY_FOR_LIVE: "false"
          SKIP_CUSTOM_DOMAIN_CHECK: "true"

      - name: Telegram alert on smoke test failure
        if: ${{ failure() && steps.smoke_test.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping alert."
            exit 0
          fi

          short_sha=$(echo "$SHA" | cut -c1-7)
          text=$(printf 'Smoke test failed after production deploy%%0AWorkflow: World-class CI/CD Bot%%0ABranch: %s%%0ASHA: %s%%0ARun: %s' "$BRANCH" "$short_sha" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"

      - name: Deployment summary
        run: |
          echo "✅ Production deployment complete"
          echo "   Worker  : ultimatearbitragehft"
          echo "   Mode    : LIVE (real trading)"
          echo "   Commit  : ${{ github.sha }}"
          echo "   Actor   : ${{ github.actor }}"

# ─────────────────────────────────────────────────────────────────────────────
# 7. GLOBAL FAILURE NOTIFICATION (any job, any branch)
# ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on any failure
    runs-on: ubuntu-latest
    needs: [lint, audit, test, build]
    if: failure()
    steps:
      - name: Failure marker
        run: echo "Pipeline failed in one or more prerequisite jobs."
