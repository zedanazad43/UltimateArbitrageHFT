name: Data Loss Prevention (DLP) and Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dlp-scan:
    name: DLP and Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: GitHub secret scanning status
        run: |
          echo "GitHub secret scanning should be enabled in repository security settings"

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
        continue-on-error: true

      - name: Gitleaks pattern detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Talisman check
        run: |
          npm install --save-dev talisman@latest
          npx talisman --scan-history
        continue-on-error: true

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: AWS key pattern detection
        run: |
          grep -r "AKIA[0-9A-Z]\{16\}" . --include="*.js" --include="*.go" --include="*.env*" && \
            echo "Potential AWS access keys found" || echo "No AWS access key patterns found"
          grep -r "aws_secret_access_key" . --include="*.js" --include="*.go" --include="*.env*" && \
            echo "Potential AWS secret patterns found" || echo "No AWS secret patterns found"
        continue-on-error: true

      - name: Generate DLP report
        run: |
          cat > dlp-report.md << 'EOF'
          # Data Loss Prevention Report

          Date: $(date -u)
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Checks:
          - GitHub secret scanning status
          - TruffleHog
          - Semgrep
          - Gitleaks
          - Talisman
          - OWASP dependency check
          - AWS key pattern scan
          EOF
          cat dlp-report.md

      - name: Upload DLP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dlp-report
          path: dlp-report.md

      - name: Telegram alert on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram secrets not set; skipping alert"
            exit 0
          fi
          text=$(printf 'DLP workflow failed%%0ARepo: %s%%0ABranch: %s%%0ACommit: %s%%0ARun: %s' "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true"
