name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Verify on node ${{ matrix.node_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [24]
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node_version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    - name: Verify production baseline (lint + tests + dry-run build)
      run: npm run verify:prod
      if: matrix.os == 'ubuntu-latest'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Lint (Windows parity)
      if: matrix.os == 'windows-latest'
      run: npm run lint

    - name: Test (Windows parity)
      if: matrix.os == 'windows-latest'
      run: npm run test:all

    - name: Check hardcoded secrets
      run: npm run check:secrets

  go-lint:
    name: Go lint (hft)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: hft/go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v1.64.8
        working-directory: hft
