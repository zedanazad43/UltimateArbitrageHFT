name = "arbitrage-bot"
main = "src/index.js"
compatibility_date = "2025-03-18"

kv_namespaces = [
    { binding = "KV_STORAGE", id = "efadbbc5889d40979c7103bc15ce6479" }
]

# Remove the legacy MarketStreamer Durable Object that was bound to this
# worker name in a previous deployment.  Without this migration wrangler
# returns error 10064 ("does not export class 'MarketStreamer'").
[[migrations]]
tag = "v1"
deleted_classes = ["MarketStreamer"]

[triggers]
crons = ["*/10 * * * *"]

# Secrets must be set via: wrangler secret put TELEGRAM_BOT_TOKEN
# and: wrangler secret put TELEGRAM_CHAT_ID
# Do NOT commit real values here.
