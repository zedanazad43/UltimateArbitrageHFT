name = "ultimatearbitragehft"
main = "index.js"
compatibility_date = "2025-04-18"
compatibility_flags = ["nodejs_compat"]
account_id = "652e53f35781522e2745784cc4425d9d"

# ── Existing bindings ──────────────────────────────────────────────

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

# Dashboard alias for the same KV namespace (name shown in Cloudflare UI).
[[kv_namespaces]]
binding = "KV_STORAGE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

# Dashboard alias for the same database (binding name shown in Cloudflare UI).
[[d1_databases]]
binding = "MY_D1"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[durable_objects.bindings]]
name = "HFT_BACKUP"
class_name = "HFTBackup"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[migrations]]
tag = "v2"
new_classes = ["HFTBackup"]

# D1 resilience backup tables
[[migrations]]
tag = "v3"
new_tables = ["backup_positions", "backup_prices", "backup_opportunities", "hft_state_sync", "failover_events", "railway_metrics"]

# ── Analytics Engine ──────────────────────────────────────────────
# Streams trade events, scan results, and errors to Cloudflare Analytics Engine.
# Dashboard: https://dash.cloudflare.com/ → Workers & Pages → Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "arbitrage_events"

# ── R2 Bucket — trade log archives ────────────────────────────────
# Stores CSV trade exports and daily PDF-style reports.
# Create: `npx wrangler r2 bucket create ultimate-arbitrage-logs`

[[r2_buckets]]
binding = "TRADE_LOGS"
bucket_name = "ultimate-arbitrage-logs"

# Dashboard alias for the same bucket (binding name shown in Cloudflare UI).
[[r2_buckets]]
binding = "R2"
bucket_name = "ultimate-arbitrage-logs"

# ── Workers AI ────────────────────────────────────────────────────
# Runs LLM-powered opportunity analysis and market summaries entirely on
# Cloudflare's GPU fleet — no external API keys required.

[ai]
binding = "AIWORKER"

# ── Queue — async trade-log pipeline ──────────────────────────────
# Producers: enqueue trade-log messages immediately after order execution so
# the hot path is never blocked by slow DB writes.
# Create: `npx wrangler queues create ultimate-arbitrage-queue`

[[queues.producers]]
binding = "TRADE_QUEUE"
queue = "ultimate-arbitrage-queue"

# Dashboard alias for the same queue (binding name shown in Cloudflare UI).
[[queues.producers]]
binding = "ULTIMATEARBITRAGEQUEUE"
queue = "ultimate-arbitrage-queue"

[[queues.consumers]]
queue = "ultimate-arbitrage-queue"
max_batch_size = 10
max_batch_timeout = 30

# ── Rate Limiter — admin endpoint protection ──────────────────────
# 20 requests per 60 seconds per IP on all admin routes.
# Uses Cloudflare's built-in rate limiting; no external service needed.

[[unsafe.bindings]]
type = "ratelimit"
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# ── Version Metadata ──────────────────────────────────────────────
# Exposes the current Worker deployment version ID, tag, and timestamp.
# Accessible at /api/version.

[version_metadata]
binding = "METADATA"

# ── Observability ─────────────────────────────────────────────────

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]

# ── Temporal Cloud — non-sensitive config vars ────────────────────
# These are plain (non-secret) configuration values exposed to the Worker.
# Update TEMPORAL_ADDRESS and TEMPORAL_NAMESPACE to match your Cloud namespace.
#
# TEMPORAL_API_KEY must be stored as a secret (never in wrangler.toml):
#   npx wrangler secret put TEMPORAL_API_KEY
#
# TEMPORAL_WORKER_URL should point to this Worker's deployed URL so that
# the Temporal worker process can call back to /scan, /api/status, etc.

[vars]
TEMPORAL_NAMESPACE  = "default"
# Set to your Cloud namespace gRPC endpoint, e.g. default.abc123.tmprl.cloud:7233
# Leave blank to connect to a local dev server (localhost:7233)
TEMPORAL_ADDRESS    = ""
# Set to your deployed Worker URL, e.g. https://ultimatearbitragehft.workers.dev
TEMPORAL_WORKER_URL = ""

# ── Go HFT engine — non-sensitive connection config ──────────────
# The Go engine exposes a REST API (GET /api/scan, POST /api/execute) that the
# Worker calls for WebSocket-fed price data and on-chain DEX execution.
#
# HFT_ENGINE_URL:    Base URL of the running Go HFT engine API server.
#                    Leave blank to disable HFT engine integration.
#                    Example: https://hft.example.com  or  http://1.2.3.4:8080
#
# HFT_ENGINE_SECRET: Must be stored as a secret (never in wrangler.toml):
#                      npx wrangler secret put HFT_ENGINE_SECRET
#                    Set the same value as HFT_ENGINE_SECRET env var on the engine.
HFT_ENGINE_URL = ""

# ── Executable ecosystem integrations (non-sensitive endpoint URLs) ──
# Set each URL to enable remote execution from dashboard/API.
# Tokens for these services should be configured as Worker secrets:
#   HUMMINGBOT_API_TOKEN, FREQTRADE_API_TOKEN, CREWAI_API_TOKEN, AUTOGPT_API_TOKEN
HUMMINGBOT_EXECUTE_URL = ""
HUMMINGBOT_STATUS_URL  = ""
FREQTRADE_EXECUTE_URL  = ""
FREQTRADE_STATUS_URL   = ""
CREWAI_EXECUTE_URL     = ""
CREWAI_STATUS_URL      = ""
AUTOGPT_EXECUTE_URL    = ""
AUTOGPT_STATUS_URL     = ""

# ── Proxy routing behavior ────────────────────────────────────────
# auto: use proxy when configured, fallback to direct requests when proxy fails
# off: force direct requests (useful for servers outside proxy)
# required: require proxy; fail request if proxy is unavailable
PROXY_MODE = "auto"

# Comma-separated exchanges that should bypass proxy when PROXY_MODE=auto.
# Example: "bitmart,mexc"
DIRECT_EXCHANGES = ""

# ── Exchange feature flags ────────────────────────────────────────
# bybit and gateio are excluded from live execution (German regulatory law).
# They remain active as price-data sources only.
# All other exchanges are enabled for full order execution when credentials are set.
# Secrets are uploaded via: pwsh ./scripts/upload-secrets.ps1
# Required secrets per exchange (use `wrangler secret put <KEY>`):
#   MEXC:    MEXC_API_KEY, MEXC_API_SECRET
#   Binance: BINANCE_API_KEY, BINANCE_API_SECRET
#   KuCoin:  KUCOIN_API_KEY, KUCOIN_SECRET_KEY, KUCOIN_PASSPHRASE
#   Bitget:  BITGET_API_KEY, BITGET_SECRET_KEY, BITGET_API_PASSPHRASE
#   Bitmart: BITMART_API_KEY, BITMART_SECRET_KEY, BITMART_MEMO
#   HTX:     HTX_API_KEY, HTX_API_SECRET

# ── Geo-Bypass Proxy Configuration (populated at deploy time) ──────────────────
BRIGHT_DATA_USER = ""
BRIGHT_DATA_PASSWORD = ""
CF_TUNNEL_US_BYPASS_URL = ""
CF_TUNNEL_EU_URL = ""
CF_TUNNEL_ASIA_URL = ""
OXYLABS_USER = ""
OXYLABS_PASSWORD = ""
