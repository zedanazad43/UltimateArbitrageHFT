name = "ultimatearbitragehft"
main = "index.js"
compatibility_date = "2025-04-18"
compatibility_flags = ["nodejs_compat"]
account_id = "652e53f35781522e2745784cc4425d9d"

# ── Existing bindings ──────────────────────────────────────────────

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

# Dashboard alias for the same KV namespace (name shown in Cloudflare UI).
[[kv_namespaces]]
binding = "KV_STORAGE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

# Dashboard alias for the same database (binding name shown in Cloudflare UI).
[[d1_databases]]
binding = "MY_D1"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[durable_objects.bindings]]
name = "HFT_BACKUP"
class_name = "HFTBackup"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[migrations]]
tag = "v2"
new_classes = ["HFTBackup"]

# D1 resilience backup tables
[[migrations]]
tag = "v3"

# ── Analytics Engine ──────────────────────────────────────────────
# Streams trade events, scan results, and errors to Cloudflare Analytics Engine.
# Dashboard: https://dash.cloudflare.com/ → Workers & Pages → Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "arbitrage_events"

# ── R2 Bucket — trade log archives ────────────────────────────────
# Stores CSV trade exports and daily PDF-style reports.
# Create: `npx wrangler r2 bucket create ultimate-arbitrage-logs`

[[r2_buckets]]
binding = "TRADE_LOGS"
bucket_name = "ultimate-arbitrage-logs"

# Dashboard alias for the same bucket (binding name shown in Cloudflare UI).
[[r2_buckets]]
binding = "R2"
bucket_name = "ultimate-arbitrage-logs"

# ── Workers AI ────────────────────────────────────────────────────
# Runs LLM-powered opportunity analysis and market summaries entirely on
# Cloudflare's GPU fleet — no external API keys required.

[ai]
binding = "AIWORKER"

# ── Queue — async trade-log pipeline ──────────────────────────────
# Producers: enqueue trade-log messages immediately after order execution so
# the hot path is never blocked by slow DB writes.
# Create: `npx wrangler queues create ultimate-arbitrage-queue`

[[queues.producers]]
binding = "TRADE_QUEUE"
queue = "ultimate-arbitrage-queue"

# Dashboard alias for the same queue (binding name shown in Cloudflare UI).
[[queues.producers]]
binding = "ULTIMATEARBITRAGEQUEUE"
queue = "ultimate-arbitrage-queue"

[[queues.consumers]]
binding = "TRADE_QUEUE_CONSUMER"
queue = "ultimate-arbitrage-queue"
max_batch_size = 10
max_batch_timeout = 30

[vars]
PROXY_MODE = "auto"
PROXY_URL_1 = "https://proxy-gateway.zedanazad43.workers.dev"
