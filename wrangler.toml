name = "ultimatearbitragehft"
main = "index.js"
compatibility_date = "2025-04-18"
compatibility_flags = ["nodejs_compat"]
account_id = "652e53f35781522e2745784cc4425d9d"
workers_dev = false

[[kv_namespaces]]
binding = "BOT_STATE"
id = "ac954cedbedd48f8aa4452975e5fc2a1"

[[d1_databases]]
binding = "DB"
database_name = "ultimate-arbitrage-db"
database_id = "cd726538-9c41-456c-b172-15fcc3a63a0c"

[[durable_objects.bindings]]
name = "MARKET_STREAMER"
class_name = "MarketStreamer"

[[migrations]]
tag = "v1"
new_classes = ["MarketStreamer"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "arbitrage_events"

[[r2_buckets]]
binding = "TRADE_LOGS"
bucket_name = "ultimate-arbitrage-logs"

[ai]
binding = "AIWORKER"

[[queues.producers]]
binding = "TRADE_QUEUE"
queue = "ultimate-arbitrage-queue"

[[queues.consumers]]
queue = "ultimate-arbitrage-queue"
max_batch_size = 10
max_batch_timeout = 30

[[unsafe.bindings]]
type = "ratelimit"
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[version_metadata]
binding = "METADATA"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "api.ecostamp.net"
custom_domain = true

[vars]
TEMPORAL_NAMESPACE  = "default"
TEMPORAL_ADDRESS    = ""
TEMPORAL_WORKER_URL = "https://ultimatearbitragehft.zedanazad43.workers.dev"
HFT_ENGINE_URL = "https://ultimatearbitragehft-production.up.railway.app"  # Go HFT engine on Railway (responsible-upliftment project, service ID: ad1edd5e)
HUMMINGBOT_EXECUTE_URL = ""  # optional: https://your-hummingbot-server:8080
HUMMINGBOT_STATUS_URL  = ""  # optional: https://your-hummingbot-server:8080/status
FREQTRADE_EXECUTE_URL  = ""  # optional: https://your-freqtrade-server:8080
FREQTRADE_STATUS_URL   = ""  # optional: https://your-freqtrade-server:8080/api/v1/status
CREWAI_EXECUTE_URL     = ""
CREWAI_STATUS_URL      = ""
AUTOGPT_EXECUTE_URL    = ""
AUTOGPT_STATUS_URL     = ""
SUPERALGOS_EXECUTE_URL = ""
SUPERALGOS_STATUS_URL  = ""
CCXT_REST_EXECUTE_URL  = ""
CCXT_REST_STATUS_URL   = ""
EXECUTIVE_LOCAL_ADAPTERS = "true"
PROXY_MODE = "auto"
PROXY_FALLBACK_URL = "https://arb-proxy-gateway.zedanazad43.workers.dev"
DIRECT_EXCHANGES = "kucoin"
EXTERNAL_PROXY_FALLBACK_URL = "https://ultimatearbitragehft-production.up.railway.app/proxy"
EXTERNAL_PROXY_FALLBACK_PROVIDER = "bright_data"
EXECUTION_EXCHANGES_ALLOWLIST = "mexc,bitget,binance,kucoin,bybit,gateio,htx"
ONEINCH_API_KEY = ""
ONEINCH_API = ""
LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_GATEWAY_URL = ""
AI_GATEWAY_ID = ""
STRATEGY_MODE = "multi_exchange"
SPOT_ONLY_LOCK_FORCE = "false"
MANUAL_RISK_LOCK_FORCE = "false"
SKIP_BALANCE_CHECK = "true"
AGGRESSIVE_SCAN_MODE = "on"
CEX_MIN_SAFETY_FACTOR = "0.10"
PERPS_MIN_SAFETY_FACTOR = "0.10"
CEX_SLIPPAGE_MULTIPLIER = "0.5"
EXPOSURE_BOOST_MULTIPLIER = "1.50"
VENUE_READY_PRIORITY_MULTIPLIER = "1.45"
AGGRESSIVE_EXECUTION_FORCE = "off"
AGGRESSIVE_FORCED_POSITION_SIZE_USD = "15"
AGGRESSIVE_FORCED_MAX_LIVE_TRADES_PER_SCAN = "20"
AGGRESSIVE_FORCED_SCALP_MIN_NET_PCT = "0.05"
AGGRESSIVE_FORCED_MIN_SECONDS_BETWEEN_TRADES = "5"
AGGRESSIVE_FORCED_SUPPORTED_SYMBOLS = "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,ADAUSDT,DOGEUSDT,LTCUSDT,TRXUSDT,LINKUSDT,AVAXUSDT,DOTUSDT,ETHBTC,BNBBTC,SOLBTC,XRPBTC,ADABTC,DOTBTC,LINKBTC,LTCBTC,AVAXBTC,BNBETH,LINKETH,DOTETH,UNIETH,SOLBNB,XRPBNB,ADABNB"
MAX_DAILY_LOSS_USD = "25"
AI_FILTER_ENABLED = "true"
AI_FILTER_MIN_CONFIDENCE = "0.7"
DEX_MULTI_CHAIN_ENABLED = "true"
DEX_CHAINS = "ethereum,polygon,arbitrum,optimism,bsc"
LIVE_EXECUTION_MIN_BALANCE_USD = "0"
BACKTEST_AUTO_ENABLED = "true"
BACKTEST_AUTO_INTERVAL_HOURS = "24"

# ── Cloudflare Web3 Gateways ────────────────────────────────────────────────────
CLOUDFLARE_GATEWAY_ETH = "https://eth-rpc.ecostamp.net"
CLOUDFLARE_GATEWAY_ARB = "https://arb-rpc.ecostamp.net"
CLOUDFLARE_GATEWAY_BSC = "https://bsc-rpc.ecostamp.net"
CLOUDFLARE_GATEWAY_IPFS = "https://ipfs-gateway.ecostamp.net"

